<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA | OCA NDA AI</title>

<style>

/* =========================================================
   ASTRA 2B-1
   OCA NDA FUTURISTIC DEFENCE INTERFACE
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050805;
    --panel: #0a100b;
    --panel2: #0e160f;

    --border: #303b30;

    --olive: #596642;
    --olive-light: #899b68;

    --gold: #c5a75b;
    --gold-light: #e0c77d;

    --white: #f1f2ed;
    --muted: #879084;

    --green: #54c477;
    --green-bright: #72ef91;

    --user: #304c35;
    --assistant: #121b13;
}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(99,126,72,.22),
            transparent 38%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(61,92,54,.10),
            transparent 30%
        ),
        #050805;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================================================
   FUTURISTIC AMBIENT GLOW
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: -30%;

    background:
        radial-gradient(
            circle,
            rgba(105,132,76,.08),
            transparent 28%
        );

    animation: ambientMove 12s ease-in-out infinite alternate;

    pointer-events: none;

    z-index: 0;
}

@keyframes ambientMove {

    from {
        transform: translate(-3%, -2%) scale(1);
    }

    to {
        transform: translate(3%, 2%) scale(1.08);
    }
}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:
        linear-gradient(
            145deg,
            rgba(13,20,14,.98),
            rgba(5,9,6,.99)
        );

    border: 1px solid #3d493b;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    position: relative;

    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        0 0 70px rgba(79,111,60,.05),
        inset 0 0 100px rgba(255,255,255,.015);

    isolation: isolate;
}


/* =========================================================
   MILITARY GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(126,148,101,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(126,148,101,.045) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .55;

    z-index: 0;

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 45px 45px;
    }
}


/* =========================================================
   HUD CORNERS
========================================================= */

.app::before {

    content: "";

    position: absolute;

    inset: 12px;

    pointer-events: none;

    z-index: 20;

    border-top: 1px solid rgba(126,145,101,.10);

    border-bottom: 1px solid rgba(126,145,101,.05);

    clip-path: polygon(
        0 0,
        100px 0,
        100px 1px,
        0 1px,
        0 100px,
        1px 100px,
        1px 0
    );
}


/* =========================================================
   OCA WATERMARK
========================================================= */

.watermark {

    position: absolute;

    width: 540px;

    height: 540px;

    left: 50%;

    top: 54%;

    transform:
        translate(-50%, -50%);

    background-image:
        url("logo.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    /*
       Slightly brighter than before.
       Still subtle enough that chat remains readable.
    */

    opacity: .095;

    filter:
        grayscale(100%)
        brightness(2.15)
        contrast(1.05);

    pointer-events: none;

    z-index: 1;

    animation: watermarkPulse 7s ease-in-out infinite;
}

@keyframes watermarkPulse {

    0%,
    100% {
        opacity: .075;
    }

    50% {
        opacity: .11;
    }
}


/* =========================================================
   SCAN LINE
========================================================= */

.app .scan-line {

    position: absolute;

    left: 0;

    right: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(126,160,99,.0),
            rgba(126,160,99,.25),
            rgba(126,160,99,.0),
            transparent
        );

    box-shadow:
        0 0 12px rgba(126,160,99,.15);

    z-index: 4;

    pointer-events: none;

    animation: scan 8s linear infinite;
}

@keyframes scan {

    from {
        top: 0;
    }

    to {
        top: 100%;
    }
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            180deg,
            rgba(17,25,17,.98),
            rgba(8,13,9,.97)
        );

    border-bottom: 1px solid #394536;

    position: relative;

    z-index: 10;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}

.brand-mark {

    width: 52px;

    height: 52px;

    border: 1px solid #78653a;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold-light);

    font-weight: bold;

    font-size: 19px;

    letter-spacing: 2px;

    background:
        linear-gradient(
            145deg,
            #222b1d,
            #0b110b
        );

    box-shadow:
        inset 0 0 20px rgba(197,167,91,.08),
        0 0 18px rgba(197,167,91,.04);

    position: relative;
}

.brand-mark::after {

    content: "";

    position: absolute;

    inset: 4px;

    border: 1px solid rgba(197,167,91,.12);

    border-radius: 7px;
}

.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;

    color: #f3f3ef;

    text-shadow:
        0 0 18px rgba(255,255,255,.04);
}

.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);

    text-transform: uppercase;
}


/* =========================================================
   STATUS
========================================================= */

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;
}

.system-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #91d99e;

    font-size: 13px;

    letter-spacing: 1px;
}

.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green-bright);

    box-shadow:
        0 0 8px rgba(84,196,119,.8),
        0 0 18px rgba(84,196,119,.45);

    animation: statusPulse 2s infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: .65;
        transform: scale(.9);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

#newChatButton {

    padding: 12px 19px;

    background:
        linear-gradient(
            145deg,
            #1b241a,
            #111711
        );

    color: #dddccf;

    border: 1px solid #4c5646;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    letter-spacing: .5px;

    transition: .25s;

    position: relative;

    overflow: hidden;
}

#newChatButton::before {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.07),
            transparent
        );

    transition: .5s;
}

#newChatButton:hover::before {
    left: 100%;
}

#newChatButton:hover {

    border-color: var(--gold);

    color: white;

    background: #222c1f;

    box-shadow:
        0 0 18px rgba(197,167,91,.08);
}


/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background: rgba(8,13,8,.95);

    border-bottom: 1px solid #252d24;

    position: relative;

    z-index: 8;
}

.command-item {

    color: #687064;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition: .25s;
}

.command-item:hover {

    color: #9aa78a;

    text-shadow:
        0 0 10px rgba(126,145,101,.25);
}

.command-item.active {

    color: var(--gold);

    text-shadow:
        0 0 12px rgba(197,167,91,.18);
}

.separator {

    height: 15px;

    width: 1px;

    background: #323a30;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 35px 32px 30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 8px;
}

.chat::-webkit-scrollbar-track {
    background: transparent;
}

.chat::-webkit-scrollbar-thumb {

    background:
        linear-gradient(
            #3c4939,
            #293329
        );

    border-radius: 10px;
}


/* =========================================================
   MESSAGES
========================================================= */

.message {

    margin-bottom: 24px;

    display: flex;

    animation: messageIn .25s ease;

    position: relative;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.bubble {

    max-width: 78%;

    padding: 17px 20px;

    border-radius: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 16px;

    position: relative;

    backdrop-filter: blur(4px);
}


/* =========================================================
   ASTRA MESSAGE
========================================================= */

.assistant .bubble {

    background:
        linear-gradient(
            145deg,
            rgba(23,31,23,.92),
            rgba(12,19,13,.94)
        );

    border: 1px solid #293629;

    color: #e5e8df;

    border-left: 3px solid #71835b;

    border-bottom-left-radius: 4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.16),
        inset 0 0 25px rgba(110,140,80,.018);

    transition: .25s;
}

.assistant .bubble:hover {

    border-left-color: #91a96e;

    box-shadow:
        0 8px 30px rgba(0,0,0,.22),
        0 0 20px rgba(113,143,82,.04);
}


/* =========================================================
   USER MESSAGE
========================================================= */

.user .bubble {

    background:
        linear-gradient(
            145deg,
            #3b573e,
            #29412f
        );

    border: 1px solid #4e674f;

    color: #f2f4ed;

    border-bottom-right-radius: 4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);
}


/* =========================================================
   MESSAGE LABEL
========================================================= */

.message.assistant::before {

    content: "ASTRA";

    position: absolute;

    margin-top: -19px;

    margin-left: 4px;

    font-size: 9px;

    letter-spacing: 1.5px;

    color: #77846b;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;
}

.welcome-content {

    position: relative;

    z-index: 3;

    animation: welcomeIn .7s ease;
}

@keyframes welcomeIn {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.welcome-emblem {

    width: 82px;

    height: 82px;

    margin: 0 auto 20px;

    border: 1px solid #685a38;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;

    background:
        radial-gradient(
            circle,
            #242d1d,
            #0b110c
        );

    box-shadow:
        0 0 25px rgba(197,167,91,.08),
        inset 0 0 25px rgba(197,167,91,.04);

    animation: emblemPulse 4s ease-in-out infinite;
}

@keyframes emblemPulse {

    0%,
    100% {
        box-shadow:
            0 0 25px rgba(197,167,91,.07),
            inset 0 0 25px rgba(197,167,91,.03);
    }

    50% {
        box-shadow:
            0 0 38px rgba(197,167,91,.13),
            inset 0 0 30px rgba(197,167,91,.06);
    }
}

.welcome h1 {

    font-size: 52px;

    letter-spacing: 11px;

    margin-bottom: 9px;

    color: #f1f2ed;

    text-shadow:
        0 0 25px rgba(255,255,255,.04);
}

.welcome .tagline {

    color: var(--gold);

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 17px;
}

.welcome p {

    color: #788174;

    font-size: 15px;

    max-width: 520px;

    line-height: 1.7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 20px;

    color: #7d8778;

    font-size: 13px;
}

.typing span.dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #82906f;

    animation: typing 1.1s infinite;
}

.typing span.dot:nth-child(2) {
    animation-delay: .15s;
}

.typing span.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        opacity: .3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    min-height: 90px;

    padding: 15px 20px;

    display: flex;

    gap: 11px;

    background:
        linear-gradient(
            180deg,
            #0b100b,
            #070b07
        );

    border-top: 1px solid #30382f;

    position: relative;

    z-index: 10;
}

.input-wrap {

    flex: 1;

    position: relative;
}

.input-wrap::after {

    content: "";

    position: absolute;

    left: 15px;

    right: 15px;

    bottom: 4px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(111,139,83,.18),
            transparent
        );

    pointer-events: none;
}

#messageInput {

    width: 100%;

    height: 58px;

    background:
        linear-gradient(
            145deg,
            #0d150e,
            #0a100b
        );

    color: #f1f2ed;

    border: 1px solid #394538;

    border-radius: 11px;

    padding: 0 18px;

    outline: none;

    font-size: 16px;

    transition: .25s;
}

#messageInput::placeholder {
    color: #697267;
}

#messageInput:focus {

    border-color: #71845a;

    box-shadow:
        0 0 0 3px rgba(104,121,83,.07),
        0 0 20px rgba(104,121,83,.05);
}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    height: 58px;

    min-width: 105px;

    border: 1px solid #77643a;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #77643a,
            #5c4c2d
        );

    color: #fff8df;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: .25s;

    box-shadow:
        0 0 20px rgba(197,167,91,.03);
}

#sendButton:hover {

    background:
        linear-gradient(
            145deg,
            #8c7645,
            #6d5a34
        );

    transform: translateY(-1px);

    box-shadow:
        0 0 25px rgba(197,167,91,.09);
}

#sendButton:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 750px) {

    body {
        overflow: hidden;
    }

    .app {

        width: 100%;

        height: 100vh;

        border-radius: 0;
    }

    header {

        height: 82px;

        padding: 0 16px;
    }

    .brand-mark {

        height: 42px;

        font-size: 15px;

    #sendButton {

</style>

<body>


<div class="app">

    <!-- FUTURISTIC SCAN EFFECT -->
    <div class="scan-line"></div>


    <!-- OCA WATERMARK -->
    <div class="watermark"></div>


    <!-- =====================================================

    ====================================================== -->

    <header>

        <div class="brand">

            <div class="brand-mark">
                OCA
            </div>

            <div class="brand-text">

                <div class="astra">

                </div>

                </div>

            </div>

        </div>

                <span class="status-dot"></span>

                <span id="statusText">
                    SYSTEM ONLINE
                </span>

            </div>


            <button id="newChatButton">

            </button>

        </div>

    </header>


    <!-- =====================================================
         COMMAND BAR
    ====================================================== -->

    <div class="command-bar">

        <span class="command-item active">
            ASTRA COMMAND
        </span>

        <span class="separator"></span>

        <span class="command-item">
            NDA PREPARATION
        </span>

        <span class="separator"></span>

        <span class="command-item">
            GAT
        </span>

        <span class="separator"></span>

        <span class="command-item">
            MATHEMATICS
        </span>

        <span class="separator"></span>

        <span class="command-item">

        </span>

        <span class="separator"></span>

    </div>

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <div class="welcome-emblem">
                    OCA
                </div>

                <h1>
                    ASTRA
                </h1>

                <div class="tagline">
                    NDA PREPARATION AI
                </div>

                <p>
                    Your intelligent academic assistant
                    for NDA preparation, mathematics,
                    GAT, current affairs and defence studies.
                </p>

            </div>

        </div>

    </div>

         INPUT
    ====================================================== -->

        <div class="input-wrap">

            <input
                id="messageInput"

                placeholder="Enter your question for ASTRA..."
                autocomplete="off"
            >

        </button>

<script>

/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   CONVERSATION ID
========================================================= */

function createConversationId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }


    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(
            /[xy]/g,
            function(c) {

                const r =
                    Math.random() * 16 | 0;

                const v =
                    c === "x"
                        ? r
                        : (r & 0x3 | 0x8);

                return v.toString(16);
            }
        );
}


let conversationId =
    localStorage.getItem(
        "astra_conversation_id"
    );


if (!conversationId) {

    conversationId =
        createConversationId();

    localStorage.setItem(
        "astra_conversation_id",
        conversationId
    );
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {
        welcome.style.display = "none";
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(
            function(element) {

                element.remove();
            }
        );


    if (welcome) {

        welcome.style.display =
            "flex";
    }
}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory() {

    try {

        /*
         IMPORTANT:

         Your backend currently uses:

         GET /api/conversations/{conversation_id}

         Therefore we use that endpoint here.
        */

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        if (!response.ok) {

            /*
             A newly generated conversation ID
             will not exist in the database yet.

             That is normal.
            */

            if (response.status === 404) {
                return;
            }

            throw new Error(
                "History request failed"
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];


        if (!messages.length) {
            return;
        }


        if (welcome) {

            welcome.style.display =
                "none";
        }


        messages.forEach(
            function(message) {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "assistant"
                );
            }
        );


        chat.scrollTop =
            chat.scrollHeight;

    }
    catch (error) {

        console.log(
            "History could not be loaded:",
            error.message
        );
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {

        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation will remain saved."
            );


        if (!confirmation) {
            return;
        }


        conversationId =
            createConversationId();


        localStorage.setItem(
            "astra_conversation_id",
            conversationId
        );


        clearChatScreen();


        input.focus();
    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE + "/health"
            );


        if (!response.ok) {
            throw new Error();
        }


        statusText.textContent =
            "SYSTEM ONLINE";

    }
    catch {

        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    input.disabled =
        true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(
                API_BASE + "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            conversation_id:
                                conversationId
                        })
                }
            );


        let data;


        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        typing.remove();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "ASTRA request failed"
            );
        }


        /*
         IMPORTANT:

         Backend creates the real conversation
         ID when the first message is sent.

         Save that ID returned by the backend.
        */

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(
                "astra_conversation_id",
                conversationId
            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        addMessage(
            answer,
            "assistant"
        );

    }
    catch (error) {

        typing.remove();


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"
        );
    }
    finally {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   START ASTRA
========================================================= */

loadHistory();

checkBackend();

input.focus();

</script>

</body>
</html>
