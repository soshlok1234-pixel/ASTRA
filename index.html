<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA | OCA NDA AI</title>

<style>

/* =========================================================
   ASTRA PHASE 2A
   OCA • NDA • FUTURISTIC DEFENCE INTERFACE
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050805;
    --panel: #0a100b;
    --panel2: #0f160f;

    --border: #303b30;
    --border-light: #4b5948;

    --olive: #65774b;
    --olive-light: #91aa6b;

    --gold: #c7a95d;
    --gold-light: #efd485;

    --white: #f2f4ed;
    --muted: #7e897b;

    --green: #59d982;
    --green-dark: #173b22;

    --user: #344c36;
    --assistant: #121a13;
}


/* =========================================================
   BODY
========================================================= */

body {
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(107, 135, 76, .20),
            transparent 42%
        ),
        radial-gradient(
            circle at 10% 100%,
            rgba(81, 117, 65, .08),
            transparent 35%
        ),
        #050805;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================================================
   ANIMATED BACKGROUND GRID
========================================================= */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(115, 140, 91, .035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(115, 140, 91, .035) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    animation:
        gridMove 20s linear infinite;

    z-index: -2;
}

@keyframes gridMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(50px);
    }
}


/* =========================================================
   AMBIENT GLOW
========================================================= */

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(105, 137, 76, .055),
            transparent 70%
        );

    pointer-events: none;

    animation: ambientPulse 5s ease-in-out infinite;

    z-index: -1;
}

@keyframes ambientPulse {

    0%,100% {
        opacity: .55;
        transform: translate(-50%, -50%) scale(.95);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}


/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:
        linear-gradient(
            145deg,
            rgba(13, 20, 14, .98),
            rgba(5, 9, 6, .99)
        );

    border: 1px solid #394638;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    position: relative;

    box-shadow:
        0 35px 100px rgba(0,0,0,.75),
        0 0 60px rgba(87,112,67,.035),
        inset 0 0 80px rgba(255,255,255,.012);

    animation: appAppear .7s ease;
}

@keyframes appAppear {

    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================================================
   APP BORDER GLOW
========================================================= */

.app::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 18px;

    pointer-events: none;

    box-shadow:
        inset 0 0 0 1px rgba(199,169,93,.035),
        inset 0 0 100px rgba(88,116,67,.025);

    z-index: 20;
}


/* =========================================================
   DECORATIVE GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.014) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.014) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .22;

    z-index: 0;
}


/* =========================================================
   OCA WATERMARK
   BRIGHTER THAN OLD VERSION
========================================================= */

.watermark {

    position: absolute;

    width: 570px;

    height: 570px;

    left: 50%;

    top: 54%;

    transform:
        translate(-50%, -50%);

    background-image:
        url("logo.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    /*
       OLD:
       opacity: .055;

       NEW:
       .10 = more visible
    */

    opacity: .10;

    filter:
        grayscale(100%)
        brightness(1.8)
        contrast(1.05);

    pointer-events: none;

    z-index: 1;

    transition:
        opacity .5s ease,
        transform .5s ease;

    animation:
        watermarkPulse 6s ease-in-out infinite;
}

@keyframes watermarkPulse {

    0%,100% {
        opacity: .075;
    }

    50% {
        opacity: .11;
    }
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            180deg,
            rgba(18,26,18,.98),
            rgba(8,13,9,.97)
        );

    border-bottom:
        1px solid #384436;

    position: relative;

    z-index: 10;

    box-shadow:
        0 5px 30px rgba(0,0,0,.20);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}

.brand-mark {

    width: 52px;

    height: 52px;

    border:
        1px solid #75643c;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-weight: bold;

    font-size: 19px;

    letter-spacing: 2px;

    background:
        linear-gradient(
            145deg,
            #222b1d,
            #0d130d
        );

    box-shadow:
        inset 0 0 20px rgba(197,167,91,.07),
        0 0 18px rgba(197,167,91,.025);

    transition: .25s;
}

.brand-mark:hover {

    border-color: var(--gold);

    box-shadow:
        0 0 20px rgba(197,167,91,.15),
        inset 0 0 20px rgba(197,167,91,.08);

    transform: translateY(-1px);
}

.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;

    color: #f3f3ef;

    text-shadow:
        0 0 20px rgba(255,255,255,.04);
}

.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);

    text-transform: uppercase;
}


/* =========================================================
   HEADER RIGHT
========================================================= */

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;
}

.system-status {

    font-size: 13px;

    letter-spacing: 1px;
}

.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px rgba(84,196,119,.8);

    animation:
        statusPulse 2s ease-in-out infinite;
}

@keyframes statusPulse {

    0%,100% {
        opacity: .65;
        box-shadow: 0 0 8px rgba(84,196,119,.4);
    }

    50% {
        opacity: 1;
        box-shadow: 0 0 16px rgba(84,196,119,.9);
    }
}


/* =========================================================
   NEW CHAT BUTTON
========================================================= */

#newChatButton {

        linear-gradient(

    border-radius: 9px;

    font-size: 14px;

    letter-spacing: .5px;

}

#newChatButton::before {

}

#newChatButton:hover::before {

    left: 100%;
}

#newChatButton:hover {

    background: #222c1f;

    transform: translateY(-1px);

    box-shadow:

/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background:
        linear-gradient(
            90deg,
            #090e09,
            #0d130d,

        );

    border-bottom:
        1px solid #252d24;

    position: relative;

    z-index: 8;
}

.command-item {

    color: #687064;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition: .2s;
}

.command-item:hover {

    color: #a7b59a;
}

.command-item.active {

    color: var(--gold);

    text-shadow:
        0 0 12px rgba(197,167,91,.15);
}

.separator {

    height: 15px;

    width: 1px;

    background: #323a30;
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        35px
        32px
        30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {

    width: 8px;
}

.chat::-webkit-scrollbar-track {

    background: transparent;
}

.chat::-webkit-scrollbar-thumb {

    background: #30382f;

    border-radius: 10px;
}

.chat::-webkit-scrollbar-thumb:hover {

    background: #4a5746;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    margin-bottom: 24px;

    display: flex;

    animation:
        messageIn .28s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform:
            translateY(10px)
            scale(.99);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.message.user {

    justify-content: flex-end;
}


/* =========================================================
   BUBBLES
========================================================= */

.bubble {

    max-width: 78%;

    padding:
        17px
        20px;

    border-radius: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 16px;

    position: relative;

    transition:
        transform .2s,
        box-shadow .2s;
}

.bubble:hover {

    transform: translateY(-1px);
}


/* ASTRA */

.assistant .bubble {

    background:
        linear-gradient(
            145deg,
            rgba(23,31,23,.96),
            rgba(15,21,16,.96)
        );

    border:
        1px solid #293329;

    color: #e5e8df;

    border-left:
        3px solid #667650;

    border-bottom-left-radius: 4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.12);
}


/* USER */

.user .bubble {

    background:
        linear-gradient(
            145deg,
            #3b523b,
            #2b402f
        );

    border:
        1px solid #4d644c;

    color: #f2f4ed;

    border-bottom-right-radius: 4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);
}


/* =========================================================
   ASTRA LABEL
========================================================= */

.message.assistant::before {

    content: "ASTRA";

    position: absolute;

    margin-top: -19px;

    margin-left: 4px;

    font-size: 9px;

    letter-spacing: 1.5px;

    color: #77846b;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.welcome-content {

    position: relative;

    z-index: 3;

    animation:
        welcomeIn .8s ease;
}

@keyframes welcomeIn {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   WELCOME EMBLEM
========================================================= */

.welcome-emblem {

    width: 82px;

    height: 82px;

    margin:
        0 auto
        20px;

    border:
        1px solid #685a38;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;

    background:
        radial-gradient(
            circle,
            #242b1d,
            #0d120d
        );

    box-shadow:
        0 0 35px rgba(197,167,91,.08);

    animation:
        emblemGlow 4s ease-in-out infinite;
}

@keyframes emblemGlow {

    0%,100% {
        box-shadow:
            0 0 25px rgba(197,167,91,.06);
    }

    50% {
        box-shadow:
            0 0 45px rgba(197,167,91,.14);
    }
}


/* =========================================================
   WELCOME TITLE
========================================================= */

.welcome h1 {

    font-size: 52px;

    letter-spacing: 11px;

    margin-bottom: 9px;

    color: #f1f2ed;

    text-shadow:
        0 0 30px rgba(255,255,255,.045);
}

.welcome .tagline {

    color: var(--gold);

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 17px;
}

.welcome p {

    color: #788174;

    font-size: 15px;

    max-width: 520px;

    line-height: 1.7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 20px;

    padding-left: 4px;
}

.typing span.dot {

    height: 6px;

    border-radius: 50%;

    animation:

}

.typing span.dot:nth-child(2) {

    animation-delay: .15s;
}

.typing span.dot:nth-child(3) {

    animation-delay: .3s;
}

@keyframes typing {

    0%,60%,100% {
        opacity: .3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    min-height: 90px;

    padding:
        15px
        20px;

    display: flex;

    gap: 11px;

    background:
        linear-gradient(
            180deg,
            #0b100b,
            #090d09
        );

    z-index: 10;

    box-shadow:
        0 -10px 30px rgba(0,0,0,.12);
}

.input-wrap {

    flex: 1;

}


/* =========================================================
   INPUT
========================================================= */

#messageInput {

    width: 100%;

    height: 58px;

    background:
        linear-gradient(
            145deg,
            #0e150f,

        );

        1px solid #394538;

    border-radius: 11px;

    padding:
        0
        18px;

    outline: none;

    font-size: 16px;

    transition:
        .25s;
}

#messageInput::placeholder {

}

#messageInput:focus {

/* =========================================================

#sendButton {

    height: 58px;

    min-width: 105px;

    border:
        1px solid #77643a;

#sendButton::before {

}

#sendButton:hover::before {

    left: 100%;
}

#sendButton:hover {

    background:
        linear-gradient(
            145deg,
            #8c7645,

        );

#sendButton:active {

#sendButton:disabled {

/* =========================================================

========================================================= */

.app .corner {

/* =========================================================

@media(max-width: 750px) {

/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   CONVERSATION ID
========================================================= */

function createConversationId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }


    return (
        "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
    ).replace(
        /[xy]/g,
        function(c) {

            const r =
                Math.random() * 16 | 0;

            const v =
                c === "x"
                    ? r
                    : (r & 0x3 | 0x8);

            return v.toString(16);
        }
    );
}


let conversationId =
    localStorage.getItem(
        "astra_conversation_id"
    );


if (!conversationId) {

    conversationId =
        createConversationId();

    localStorage.setItem(
        "astra_conversation_id",
        conversationId
    );
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR CHAT SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(
            function(element) {

                element.remove();
            }
        );


    if (welcome) {

        welcome.style.display =
            "flex";
    }
}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        if (!response.ok) {

            throw new Error(
                "History request failed"
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];


        if (!messages.length) {

            return;
        }


        if (welcome) {

            welcome.style.display =
                "none";
        }


        messages.forEach(
            function(message) {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "assistant"
                );

            }
        );


        chat.scrollTop =
            chat.scrollHeight;

    }

    catch (error) {

        console.log(
            "History could not be loaded:",
            error.message
        );
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {

        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation will remain saved."
            );


        if (!confirmation) {

            return;
        }


        conversationId =
            createConversationId();


        localStorage.setItem(
            "astra_conversation_id",
            conversationId
        );


        clearChatScreen();


        input.focus();
    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/health"
            );


        if (!response.ok) {

            throw new Error();
        }


        statusText.textContent =
            "SYSTEM ONLINE";

    }

    catch {

        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "typing";


    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    input.disabled =
        true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message,

                            conversation_id:
                                conversationId
                        })
                }
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        typing.remove();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "ASTRA request failed"
            );
        }


        /*
           IMPORTANT:

           The backend returns the real
           database conversation ID.

           Save it so the next message
           continues the same conversation.
        */

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(
                "astra_conversation_id",
                conversationId
            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        addMessage(
            answer,
            "assistant"
        );

    }

    catch (error) {

        typing.remove();


        addMessage(
            "Connection error.\n\n" +
            error.message,
            "assistant"
        );
    }

    finally {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   START ASTRA
========================================================= */

loadHistory();

checkBackend();

input.focus();

</script>

</body>
</html>
