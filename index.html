<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASTRA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ==============================
       MAIN APP
    ============================== */

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;

      background: #111820;

      border: 1px solid #26313d;
      border-radius: 20px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }


    /* ==============================
       HEADER
    ============================== */

    header {
      padding: 20px 25px;

      border-bottom: 1px solid #26313d;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #111820;

      position: relative;
      z-index: 5;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .status {
      font-size: 13px;
      color: #55d68a;
    }


    /* ==============================
       CHAT AREA
    ============================== */

    .chat {
      position: relative;

      flex: 1;

      overflow-y: auto;

      padding: 25px;

      background: transparent;
    }


    /* ==============================
       PDF STYLE WATERMARK
       SINGLE CENTERED LOGO
    ============================== */

    .chat::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 380px;
      height: 380px;

      background-image: url("./logo.png");

      background-repeat: no-repeat;

      background-position: center;

      background-size: contain;

      /*
        Change this number if you want
        the logo lighter/darker.

        0.04 = very faint
        0.07 = recommended
        0.10 = more visible
      */

      opacity: 0.07;

      /*
        Makes sure the watermark
        never blocks clicking.
      */

      pointer-events: none;

      /*
        Watermark stays behind messages.
      */

      z-index: 0;
    }


    /* ==============================
       CHAT CONTENT ABOVE WATERMARK
    ============================== */

    .chat > * {
      position: relative;

      z-index: 1;
    }


    /* ==============================
       MESSAGES
    ============================== */

    .message {
      margin-bottom: 18px;

      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;

      padding: 13px 17px;

      border-radius: 15px;

      line-height: 1.5;

      white-space: pre-wrap;

      /*
        Slight transparency allows
        the watermark to remain subtly
        visible like a PDF watermark.
      */

      backdrop-filter: blur(2px);
    }


    /* ASTRA MESSAGE */

    .assistant .bubble {
      background: rgba(27, 37, 48, 0.94);
    }


    /* USER MESSAGE */

    .user .bubble {
      background: rgba(49, 93, 145, 0.94);
    }


    /* ==============================
       WELCOME SCREEN
    ============================== */

    .welcome {
      text-align: center;

      margin-top: 25%;

      color: #9ba7b4;
    }

    .welcome h1 {
      color: white;

      font-size: 42px;

      margin-bottom: 10px;
    }


    /* ==============================
       INPUT AREA
    ============================== */

    .input-area {
      padding: 18px;

      border-top: 1px solid #26313d;

      display: flex;

      gap: 10px;

      background: #111820;

      position: relative;

      z-index: 5;
    }


    /* INPUT */

    #messageInput {
      flex: 1;

      background: #0b1016;

      color: white;

      border: 1px solid #344250;

      border-radius: 12px;

      padding: 14px;

      outline: none;

      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #557da8;
    }


    /* SEND BUTTON */

    #sendButton {
      border: none;

      border-radius: 12px;

      padding: 0 22px;

      background: #315d91;

      color: white;

      font-size: 16px;

      cursor: pointer;

      transition: background 0.2s ease;
    }

    #sendButton:hover {
      background: #3b6fa9;
    }

    #sendButton:disabled {
      opacity: .5;

      cursor: not-allowed;
    }


    /* ==============================
       TYPING
    ============================== */

    .typing {
      color: #9ba7b4;

      font-style: italic;

      margin-bottom: 15px;
    }


    /* ==============================
       SCROLLBAR
    ============================== */

    .chat::-webkit-scrollbar {
      width: 8px;
    }

    .chat::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #344250;

      border-radius: 10px;
    }

    .chat::-webkit-scrollbar-thumb:hover {
      background: #46586a;
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

      .app {
        width: 100%;

        height: 100vh;

        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }

      .welcome h1 {
        font-size: 34px;
      }

      .chat::before {
        width: 280px;

        height: 280px;
      }

      #sendButton {
        padding: 0 16px;
      }
    }

  </style>
</head>


<body>

  <div class="app">


    <!-- ==============================
         HEADER
    ============================== -->

    <header>

      <div class="logo">
        ASTRA
      </div>

      <div
        class="status"
        id="status"
      >
        ● Checking...
      </div>

    </header>


    <!-- ==============================
         CHAT
    ============================== -->

    <div
      class="chat"
      id="chat"
    >

      <div
        class="welcome"
        id="welcome"
      >

        <h1>
          ASTRA
        </h1>

        <p>
          Your AI assistant
        </p>

      </div>

    </div>


    <!-- ==============================
         INPUT
    ============================== -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Message ASTRA..."
        autocomplete="off"
      >

      <button
        id="sendButton"
      >
        Send
      </button>

    </div>

  </div>


  <!-- ==============================
       JAVASCRIPT
  ============================== -->

  <script>

    /*
      YOUR LIVE BACKEND
    */

    const API_BASE =
      "https://astra-backend-2hac.onrender.com";


    /*
      ELEMENTS
    */

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const welcome =
      document.getElementById("welcome");


    /* ==============================
       CHECK BACKEND
    ============================== */

    async function checkBackend() {

      try {

        const response =
          await fetch(
            API_BASE + "/health"
          );


        if (response.ok) {

          status.textContent =
            "● Online";

          status.style.color =
            "#55d68a";

        } else {

          throw new Error(
            "Backend unavailable"
          );

        }

      } catch (error) {

        status.textContent =
          "● Offline";

        status.style.color =
          "#ff6464";
      }
    }


    /* ==============================
       ADD MESSAGE
    ============================== */

    function addMessage(
      text,
      type
    ) {

      if (welcome) {

        welcome.style.display =
          "none";
      }


      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      message.appendChild(
        bubble
      );


      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;
    }


    /* ==============================
       SEND MESSAGE
    ============================== */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {

        return;
      }


      /*
        Add user message
      */

      addMessage(
        message,
        "user"
      );


      /*
        Clear input
      */

      input.value = "";


      /*
        Disable controls
      */

      sendButton.disabled =
        true;

      input.disabled =
        true;


      /*
        Typing indicator
      */

      const typing =
        document.createElement(
          "div"
        );

      typing.className =
        "typing";

      typing.textContent =
        "ASTRA is thinking...";


      chat.appendChild(
        typing
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        /*
          SEND TO BACKEND
        */

        const response =
          await fetch(
            API_BASE + "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message:
                    message
                })
            }
          );


        /*
          Read response
        */

        const data =
          await response.json();


        /*
          Remove typing
        */

        typing.remove();


        /*
          Check error
        */

        if (!response.ok) {

          throw new Error(
            data.detail ||
            "Request failed"
          );
        }


        /*
          Add ASTRA response
        */

        addMessage(
          data.reply ||
          "ASTRA did not return a response.",
          "assistant"
        );


      } catch (error) {

        /*
          Remove typing
        */

        typing.remove();


        /*
          Show error
        */

        addMessage(
          "Sorry, I couldn't connect to ASTRA right now.\n\nError: " +
          error.message,
          "assistant"
        );


      } finally {

        /*
          Enable controls
        */

        sendButton.disabled =
          false;

        input.disabled =
          false;

        input.focus();
      }

    }


    /* ==============================
       SEND BUTTON
    ============================== */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ==============================
       ENTER KEY
    ============================== */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );


    /* ==============================
       START
    ============================== */

    checkBackend();

  </script>

</body>
</html>
