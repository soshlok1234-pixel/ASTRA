
<script>
/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE = "https://astra-backend-2hac.onrender.com";
const CONVERSATION_KEY = "astra_conversation_id";
const CONVERSATIONS_KEY = "astra_conversations_list";

/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const newChatButton = document.getElementById("newChatButton");
const statusText = document.getElementById("statusText");
const welcome = document.getElementById("welcome");
const historyList = document.getElementById("historyList");
const historySearch = document.getElementById("historySearch");
const sidebar = document.getElementById("sidebar");
const historyButton = document.getElementById("historyButton");
const sidebarOverlay = document.getElementById("sidebarOverlay");

/* =========================================================
   CONVERSATION ID
========================================================= */

function createConversationId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

let conversationId = localStorage.getItem(CONVERSATION_KEY);

if (!conversationId) {
    conversationId = createConversationId();
    localStorage.setItem(CONVERSATION_KEY, conversationId);
}

function getSavedConversations() {
    try {
        const saved = JSON.parse(
            localStorage.getItem(CONVERSATIONS_KEY) || "[]"
        );
        return Array.isArray(saved) ? saved : [];
    } catch {
        return [];
    }
}

let allConversations = getSavedConversations();

function saveConversations() {
    localStorage.setItem(
        CONVERSATIONS_KEY,
        JSON.stringify(allConversations)
    );
}

function updateConversationList(id, title) {
    const existing = allConversations.find(item => item.id === id);

    if (existing) {
        existing.title = existing.title || title || "New conversation";
        existing.updated_at = new Date().toISOString();
    } else {
        allConversations.unshift({
            id: id,
            title: title || "New conversation",
            updated_at: new Date().toISOString()
        });
    }

    allConversations.sort(
        (a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
    );

    saveConversations();
    renderHistory();
}

/* =========================================================
   MESSAGES
========================================================= */

function addMessage(text, type) {
    if (welcome) welcome.style.display = "none";

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text == null ? "" : String(text);

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

function clearChatScreen() {
    chat.querySelectorAll(".message, .typing").forEach(element => {
        element.remove();
    });

    if (welcome) welcome.style.display = "flex";
}

/* =========================================================
   LOAD A CONVERSATION FROM BACKEND
========================================================= */

async function loadConversation(id) {
    if (!id) return;

    try {
        const response = await fetch(
            API_BASE + "/api/history?conversation_id=" +
            encodeURIComponent(id)
        );

        if (!response.ok) {
            throw new Error("History request failed (" + response.status + ")");
        }

        const data = await response.json();

        conversationId = id;
        localStorage.setItem(CONVERSATION_KEY, conversationId);

        clearChatScreen();

        const messages = Array.isArray(data.messages) ? data.messages : [];

        messages.forEach(message => {
            addMessage(
                message.content || "",
                message.role === "user" ? "user" : "assistant"
            );
        });

        renderHistory();
        closeSidebar();
    } catch (error) {
        console.error("Could not load conversation:", error);
        alert(
            "Could not load this conversation. It may not exist on the server."
        );
    }
}

/* =========================================================
   LOAD CURRENT CHAT ON STARTUP
========================================================= */

async function loadCurrentConversation() {
    const id = localStorage.getItem(CONVERSATION_KEY);

    if (!id) return;

    try {
        const response = await fetch(
            API_BASE + "/api/history?conversation_id=" +
            encodeURIComponent(id)
        );

        if (!response.ok) {
            // An empty/new conversation may not exist on the server yet.
            return;
        }

        const data = await response.json();
        const messages = Array.isArray(data.messages) ? data.messages : [];

        if (messages.length === 0) return;

        clearChatScreen();

        messages.forEach(message => {
            addMessage(
                message.content || "",
                message.role === "user" ? "user" : "assistant"
            );
        });

        const firstUserMessage = messages.find(m => m.role === "user");

        updateConversationList(
            id,
            firstUserMessage
                ? firstUserMessage.content.slice(0, 45)
                : "Conversation"
        );
    } catch (error) {
        console.warn("Could not restore chat:", error);
    }
}

/* =========================================================
   HISTORY SIDEBAR
   The list is stored locally because the backend's documented
   endpoints do not include a GET endpoint for all conversations.
========================================================= */

function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleDateString(undefined, {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function renderHistory() {
    if (!historyList) return;

    const search = historySearch
        ? historySearch.value.trim().toLowerCase()
        : "";

    const conversations = allConversations.filter(item => {
        return !search ||
            (item.title || "").toLowerCase().includes(search);
    });

    historyList.innerHTML = "";

    if (conversations.length === 0) {
        historyList.innerHTML = `
            <div class="history-empty">
                No saved conversations yet.<br><br>
                Start a chat to see it here.
            </div>
        `;
        return;
    }

    conversations.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";

        if (item.id === conversationId) {
            row.classList.add("active");
        }

        const title = document.createElement("div");
        title.className = "history-item-title";
        title.textContent = item.title || "Untitled conversation";

        const date = document.createElement("div");
        date.className = "history-item-date";
        date.textContent = formatDate(item.updated_at);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-history";
        deleteButton.textContent = "×";
        deleteButton.title = "Remove from sidebar";
        deleteButton.setAttribute("aria-label", "Remove conversation");

        deleteButton.addEventListener("click", event => {
            event.stopPropagation();
            removeConversationFromList(item.id);
        });

        row.appendChild(title);
        row.appendChild(date);
        row.appendChild(deleteButton);

        row.addEventListener("click", () => loadConversation(item.id));

        historyList.appendChild(row);
    });
}

function removeConversationFromList(id) {
    const confirmed = confirm(
        "Remove this conversation from the sidebar?\n\n" +
        "This removes the local list entry. It does not delete messages on the server."
    );

    if (!confirmed) return;

    allConversations = allConversations.filter(item => item.id !== id);
    saveConversations();
    renderHistory();

    // Do not erase the currently open chat.
}

/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener("click", () => {
    conversationId = createConversationId();

    localStorage.setItem(CONVERSATION_KEY, conversationId);

    clearChatScreen();
    renderHistory();
    closeSidebar();
    input.focus();
});

/* =========================================================
   SEARCH
========================================================= */

if (historySearch) {
    historySearch.addEventListener("input", renderHistory);
}

/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function openSidebar() {
    sidebar.classList.add("open");
    sidebarOverlay.classList.add("show");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("show");
}

historyButton.addEventListener("click", openSidebar);
sidebarOverlay.addEventListener("click", closeSidebar);

/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {
    try {
        const response = await fetch(API_BASE + "/health");

        if (!response.ok) throw new Error("Backend unavailable");

        statusText.textContent = "SYSTEM ONLINE";
    } catch {
        statusText.textContent = "SYSTEM OFFLINE";
    }
}

/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";

    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;

    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    return typing;
}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {
    const message = input.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage(message, "user");

    input.value = "";
    sendButton.disabled = true;
    input.disabled = true;

    const typing = createTyping();

    try {
        const response = await fetch(API_BASE + "/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                conversation_id: conversationId
            })
        });

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("Invalid response from ASTRA server");
        }

        if (!response.ok) {
            throw new Error(
                data.detail || "ASTRA request failed (" + response.status + ")"
            );
        }

        if (data.conversation_id) {
            conversationId = data.conversation_id;
            localStorage.setItem(CONVERSATION_KEY, conversationId);
        }

        typing.remove();

        const answer = data.reply || "ASTRA did not return a response.";

        addMessage(answer, "assistant");

        const existing = allConversations.find(
            item => item.id === conversationId
        );

        updateConversationList(
            conversationId,
            existing ? existing.title : message.slice(0, 45)
        );
    } catch (error) {
        typing.remove();

        addMessage(
            "Connection error.\n\n" + error.message,
            "assistant"
        );

        console.error("ASTRA chat error:", error);
    } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
    }
}

/* =========================================================
   SEND CONTROLS
========================================================= */

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

/* =========================================================
   START ASTRA
========================================================= */

renderHistory();
checkBackend();
loadCurrentConversation();
input.focus();
</script>
