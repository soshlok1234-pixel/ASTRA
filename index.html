<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    header {
      padding: 20px 25px;
      border-bottom: 1px solid #26313d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .status {
      font-size: 13px;
      color: #55d68a;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      background: #1b2530;
    }

    .user .bubble {
      background: #315d91;
    }

    .welcome {
      text-align: center;
      margin-top: 25%;
      color: #9ba7b4;
    }

    .welcome h1 {
      color: white;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #26313d;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      background: #0b1016;
      color: white;
      border: 1px solid #344250;
      border-radius: 12px;
      padding: 14px;
      outline: none;
      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #557da8;
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: #315d91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #3b6fa9;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .typing {
      color: #9ba7b4;
      font-style: italic;
      margin-bottom: 15px;
    }

    /* VOICE CONTROLS */

    .voice-controls {
      margin-top: 10px;
      display: flex;
      gap: 7px;
    }

    .voice-button {
      border: 1px solid #344250;
      background: #111820;
      color: #cbd5df;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .voice-button:hover {
      background: #263544;
      color: white;
    }

    .speaking {
      color: #55d68a;
      font-size: 12px;
      margin-left: 5px;
      display: none;
      align-items: center;
    }

    .speaking.active {
      display: inline-flex;
    }

    @media (max-width: 600px) {

      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }

      .welcome h1 {
        font-size: 34px;
      }

      .input-area {
        padding: 12px;
      }

      #sendButton {
        padding: 0 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">ASTRA</div>
      <div class="status" id="status">● Checking...</div>
    </header>

    <div class="chat" id="chat">

      <div class="welcome" id="welcome">
        <h1>ASTRA</h1>
        <p>Your AI assistant</p>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Message ASTRA..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script>

    // =====================================================
    // YOUR LIVE BACKEND
    // =====================================================

    const API_BASE =
      "https://astra-backend-2hac.onrender.com";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const welcome =
      document.getElementById("welcome");


    // =====================================================
    // VOICE SETTINGS
    // =====================================================

    let currentSpeech = null;


    // =====================================================
    // STOP SPEAKING
    // =====================================================

    function stopSpeaking() {

      if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

      }

      currentSpeech = null;

      document
        .querySelectorAll(".speaking")
        .forEach(function(element) {

          element.classList.remove("active");

        });
    }


    // =====================================================
    // SPEAK ASTRA ANSWER
    // =====================================================

    function speakText(text, indicator = null) {

      if (!("speechSynthesis" in window)) {

        console.log(
          "Text-to-speech is not supported by this browser."
        );

        return;

      }

      // Stop previous speech first.
      window.speechSynthesis.cancel();

      if (indicator) {
        indicator.classList.add("active");
      }

      // Clean some markdown symbols before speaking.
      let cleanText = text
        .replace(/```[\s\S]*?```/g, "")
        .replace(/[*#_`]/g, "")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/\n+/g, ". ")
        .replace(/\s+/g, " ")
        .trim();

      if (!cleanText) {

        if (indicator) {
          indicator.classList.remove("active");
        }

        return;
      }

      const speech =
        new SpeechSynthesisUtterance(cleanText);

      speech.lang = "en-IN";

      speech.rate = 0.95;

      speech.pitch = 1.0;

      speech.volume = 1.0;


      // Try to select a good English voice.
      const voices =
        window.speechSynthesis.getVoices();

      const preferredVoice =
        voices.find(function(voice) {

          return (
            voice.lang === "en-IN"
          );

        }) ||
        voices.find(function(voice) {

          return (
            voice.lang.startsWith("en")
          );

        });

      if (preferredVoice) {

        speech.voice = preferredVoice;

      }


      speech.onend = function() {

        if (indicator) {
          indicator.classList.remove("active");
        }

        currentSpeech = null;

      };


      speech.onerror = function() {

        if (indicator) {
          indicator.classList.remove("active");
        }

        currentSpeech = null;

      };


      currentSpeech = speech;

      window.speechSynthesis.speak(speech);
    }


    // =====================================================
    // LOAD BROWSER VOICES
    // =====================================================

    if ("speechSynthesis" in window) {

      window.speechSynthesis.onvoiceschanged =
        function() {

          window.speechSynthesis.getVoices();

        };

    }


    // =====================================================
    // CHECK BACKEND
    // =====================================================

    async function checkBackend() {

      try {

        const response =
          await fetch(
            API_BASE + "/health"
          );

        if (response.ok) {

          status.textContent =
            "● Online";

          status.style.color =
            "#55d68a";

        } else {

          throw new Error(
            "Backend unavailable"
          );

        }

      } catch (error) {

        status.textContent =
          "● Offline";

        status.style.color =
          "#ff6464";

      }
    }


    // =====================================================
    // ADD USER MESSAGE
    // =====================================================

    function addUserMessage(text) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const message =
        document.createElement("div");

      message.className =
        "message user";

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;

      message.appendChild(bubble);

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;
    }


    // =====================================================
    // ADD ASTRA MESSAGE
    // =====================================================

    function addAssistantMessage(text) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const message =
        document.createElement("div");

      message.className =
        "message assistant";


      const container =
        document.createElement("div");

      container.style.maxWidth =
        "75%";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      // ---------------------------------------------------
      // VOICE CONTROLS
      // ---------------------------------------------------

      const controls =
        document.createElement("div");

      controls.className =
        "voice-controls";


      const readButton =
        document.createElement("button");

      readButton.className =
        "voice-button";

      readButton.textContent =
        "🔊 Read aloud";


      const stopButton =
        document.createElement("button");

      stopButton.className =
        "voice-button";

      stopButton.textContent =
        "⏹ Stop";


      const speaking =
        document.createElement("span");

      speaking.className =
        "speaking";

      speaking.textContent =
        "● Speaking";


      readButton.onclick =
        function() {

          speakText(
            text,
            speaking
          );

        };


      stopButton.onclick =
        function() {

          stopSpeaking();

        };


      controls.appendChild(
        readButton
      );

      controls.appendChild(
        stopButton
      );

      controls.appendChild(
        speaking
      );


      container.appendChild(
        bubble
      );

      container.appendChild(
        controls
      );

      message.appendChild(
        container
      );

      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;


      // ---------------------------------------------------
      // AUTOMATICALLY READ ANSWER
      // ---------------------------------------------------

      speakText(
        text,
        speaking
      );
    }


    // =====================================================
    // SEND MESSAGE
    // =====================================================

    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) {
        return;
      }


      // Stop any previous speech.
      stopSpeaking();


      // Add user message.
      addUserMessage(message);


      input.value = "";

      sendButton.disabled =
        true;

      input.disabled =
        true;


      // Typing indicator.
      const typing =
        document.createElement("div");

      typing.className =
        "typing";

      typing.textContent =
        "ASTRA is thinking...";


      chat.appendChild(
        typing
      );

      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            API_BASE + "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          throw new Error(
            data.detail ||
            "Request failed"
          );

        }


        const answer =
          data.reply ||
          "ASTRA did not return a response.";


        addAssistantMessage(
          answer
        );


      } catch (error) {

        typing.remove();


        addAssistantMessage(
          "Sorry, I couldn't connect to ASTRA right now.\n\nError: " +
          error.message
        );


      } finally {

        sendButton.disabled =
          false;

        input.disabled =
          false;

        input.focus();

      }
    }


    // =====================================================
    // BUTTON
    // =====================================================

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // =====================================================
    // ENTER KEY
    // =====================================================

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    // =====================================================
    // START
    // =====================================================

    checkBackend();

  </script>

</body>
</html>
