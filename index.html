<script>
/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE = "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const newChatButton = document.getElementById("newChatButton");
const statusText = document.getElementById("statusText");
const welcome = document.getElementById("welcome");


/* =========================================================
   CONVERSATION ID
========================================================= */

/*
   IMPORTANT:

   We DO NOT create a random conversation ID here.

   The backend creates the real conversation ID.

   After the first message, ASTRA returns that ID and
   we save it in localStorage.
*/

let conversationId =
    localStorage.getItem("astra_conversation_id");


/* =========================================================
   ADD MESSAGE TO SCREEN
========================================================= */

function addMessage(text, type) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;


    message.appendChild(bubble);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR CHAT SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(function(element) {

            element.remove();

        });


    if (welcome) {
        welcome.style.display = "flex";
    }
}


/* =========================================================
   LOAD SAVED CONVERSATION
========================================================= */

async function loadHistory() {

    /*
       If there is no saved conversation,
       there is nothing to load.
    */

    if (!conversationId) {

        console.log(
            "ASTRA: No saved conversation yet."
        );

        return;
    }


    console.log(
        "ASTRA: Loading conversation:",
        conversationId
    );


    try {

        /*
           CORRECT BACKEND ENDPOINT

           Your main.py provides:

           /api/conversations/{conversation_id}
        */

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        /*
           If backend says conversation
           does not exist, remove the old ID.
        */

        if (response.status === 404) {

            console.log(
                "ASTRA: Saved conversation no longer exists."
            );


            localStorage.removeItem(
                "astra_conversation_id"
            );


            conversationId = null;

            return;
        }


        if (!response.ok) {

            throw new Error(
                "History request failed: " +
                response.status
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];


        if (!messages.length) {

            console.log(
                "ASTRA: Conversation is empty."
            );

            return;
        }


        if (welcome) {
            welcome.style.display = "none";
        }


        /*
           Display every saved message.
        */

        messages.forEach(function(message) {

            addMessage(
                message.content,

                message.role === "user"
                    ? "user"
                    : "assistant"
            );

        });


        chat.scrollTop =
            chat.scrollHeight;


        console.log(
            "ASTRA: Conversation loaded successfully."
        );

    }
    catch (error) {

        console.error(
            "ASTRA: Could not load history:",
            error
        );

    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {

        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation will remain saved."
            );


        if (!confirmation) {
            return;
        }


        /*
           Remove ONLY the current conversation ID.

           The database conversation is NOT deleted.
        */

        localStorage.removeItem(
            "astra_conversation_id"
        );


        conversationId = null;


        clearChatScreen();


        input.focus();


        console.log(
            "ASTRA: New conversation started."
        );

    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE + "/health"
            );


        if (!response.ok) {

            throw new Error(
                "Backend unavailable"
            );

        }


        const data =
            await response.json();


        if (
            data.status === "ok" &&
            data.gemini === true
        ) {

            statusText.textContent =
                "SYSTEM ONLINE";

        }
        else {

            statusText.textContent =
                "SYSTEM LIMITED";

        }

    }
    catch (error) {

        console.error(
            "ASTRA backend error:",
            error
        );


        statusText.textContent =
            "SYSTEM OFFLINE";

    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement("div");


    typing.className =
        "typing";


    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;


    chat.appendChild(typing);


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    /*
       Show user's message immediately.
    */

    addMessage(
        message,
        "user"
    );


    input.value = "";


    sendButton.disabled = true;

    input.disabled = true;


    const typing =
        createTyping();


    try {

        console.log(
            "ASTRA: Sending message..."
        );


        /*
           Build request.

           FIRST MESSAGE:
           conversation_id = null

           BACKEND:
           creates conversation

           BACKEND RETURNS:
           real conversation_id

           FRONTEND:
           saves it
        */

        const requestBody = {
            message: message
        };


        /*
           Only send conversation_id
           if we already have one.
        */

        if (conversationId) {

            requestBody.conversation_id =
                conversationId;

        }


        const response =
            await fetch(
                API_BASE + "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )
                }
            );


        let data;


        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );

        }


        /*
           Remove typing indicator.
        */

        typing.remove();


        /*
           Handle backend errors.
        */

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "ASTRA request failed"
            );

        }


        /*
           VERY IMPORTANT:

           Save the REAL conversation ID
           returned by the backend.
        */

        if (data.conversation_id) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(
                "astra_conversation_id",
                conversationId
            );


            console.log(
                "ASTRA: Conversation ID saved:",
                conversationId
            );

        }


        /*
           Display ASTRA answer.
        */

        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        addMessage(
            answer,
            "assistant"
        );


        console.log(
            "ASTRA: Message saved successfully."
        );

    }
    catch (error) {

        /*
           Remove typing indicator
           if it still exists.
        */

        if (
            typing &&
            typing.parentNode
        ) {

            typing.remove();

        }


        console.error(
            "ASTRA ERROR:",
            error
        );


        addMessage(
            "Connection error.\n\n" +
            error.message,
            "assistant"
        );

    }
    finally {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();

    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   START ASTRA
========================================================= */

console.log(
    "ASTRA starting..."
);


console.log(
    "Current conversation ID:",
    conversationId
);


loadHistory();


checkBackend();


input.focus();

</script>
