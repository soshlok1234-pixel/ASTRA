<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA | OCA NDA AI</title>

<style>

/* =========================================================
   ASTRA — OCA NDA DEFENCE AI
   PHASE 2B FUTURISTIC UI
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {

    --bg: #080b08;
    --panel: #0d120e;
    --panel2: #111811;

    --border: #30382f;

    --olive: #596642;
    --olive-light: #7f9160;

    --gold: #c5a75b;
    --gold-light: #e0c77d;

    --white: #f1f2ed;
    --muted: #929a8d;

    --user: #344b35;
    --assistant: #151d16;

    --green: #54c477;
}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(93,111,67,.14),
            transparent 40%
        ),

        radial-gradient(
            circle at 20% 100%,
            rgba(197,167,91,.035),
            transparent 35%
        ),

        #080b08;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:

        linear-gradient(
            145deg,
            rgba(16,22,16,.97),
            rgba(7,10,8,.98)
        );

    border: 1px solid #3b4337;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    position: relative;

    box-shadow:

        0 30px 100px rgba(0,0,0,.65),

        inset 0 0 80px rgba(255,255,255,.015);

    animation: astraBoot .8s ease-out;
}


/* =========================================================
   APP BOOT
========================================================= */

@keyframes astraBoot {

    from {

        opacity: 0;

        transform: scale(.985);

        filter: brightness(.7);
    }

    to {

        opacity: 1;

        transform: scale(1);

        filter: brightness(1);
    }
}


/* =========================================================
   FUTURISTIC GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .18;

    z-index: 0;

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {

        background-position:
            0 0,
            0 0;
    }

    to {

        background-position:
            45px 45px,
            45px 45px;
    }
}


/* =========================================================
   OCA WATERMARK
========================================================= */

.watermark {

    position: absolute;

    width: 520px;

    height: 520px;

    left: 50%;

    top: 53%;

    transform:
        translate(-50%,-50%);

    background-image:
        url("logo.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    opacity: .085;

    filter:

        grayscale(100%)
        brightness(1.9)
        contrast(1.05);

    pointer-events: none;

    z-index: 1;

    animation:
        watermarkPulse 6s ease-in-out infinite;
}

@keyframes watermarkPulse {

    0%,
    100% {

        opacity: .065;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50% {

        opacity: .10;

        transform:
            translate(-50%,-50%)
            scale(1.025);
    }
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:

        linear-gradient(
            180deg,
            rgba(18,24,18,.98),
            rgba(10,14,10,.96)
        );

    border-bottom: 1px solid #394236;

    position: relative;

    z-index: 10;

    box-shadow:

        0 1px 0 rgba(255,255,255,.015),

        0 8px 30px rgba(0,0,0,.12);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}


.brand-mark {

    width: 52px;

    height: 52px;

    border: 1px solid #70623d;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-weight: bold;

    font-size: 19px;

    letter-spacing: 2px;

    background:

        linear-gradient(
            145deg,
            #20271c,
            #0e130e
        );

    box-shadow:

        inset 0 0 20px
        rgba(197,167,91,.06);

    position: relative;

    overflow: hidden;

    transition:

        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}


.brand-mark::after {

    content: "";

    position: absolute;

    width: 120%;

    height: 2px;

    left: -120%;

    top: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(224,199,125,.8),
            transparent
        );

    animation:
        logoScan 4s linear infinite;
}

@keyframes logoScan {

    0% {
        left: -120%;
    }

    100% {
        left: 120%;
    }
}


.brand-mark:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--gold);

    box-shadow:

        0 0 18px
        rgba(197,167,91,.12),

        inset 0 0 20px
        rgba(197,167,91,.08);
}


.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}


.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;

    color: #f3f3ef;

    text-shadow:

        0 0 8px rgba(255,255,255,.08),

        0 0 25px rgba(197,167,91,.08);

    transition: .3s ease;
}


.astra:hover {

    text-shadow:

        0 0 10px rgba(255,255,255,.18),

        0 0 35px rgba(197,167,91,.16);
}


.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);

    text-transform: uppercase;
}


/* =========================================================
   STATUS
========================================================= */

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;
}


.system-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #8fd49e;

    font-size: 13px;

    letter-spacing: 1px;
}


.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

    animation:
        statusPulse 2s ease-in-out infinite;
}


@keyframes statusPulse {

    0%,
    100% {

        box-shadow:
            0 0 5px
            rgba(84,196,119,.5);
    }

    50% {

        box-shadow:
            0 0 16px
            rgba(84,196,119,1);
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

#newChatButton {

    padding: 12px 19px;

    background:

        linear-gradient(
            145deg,
            #1b241a,
            #111711
        );

    color: #dddccf;

    border: 1px solid #4c5646;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    letter-spacing: .5px;

    transition:

        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


#newChatButton:hover {

    transform:
        translateY(-1px);

    border-color:
        var(--gold);

    color: white;

    background:
        #222c1f;

    box-shadow:

        0 5px 18px
        rgba(0,0,0,.25),

        0 0 15px
        rgba(197,167,91,.04);
}


/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background: #0b100b;

    border-bottom: 1px solid #252c24;

    position: relative;

    z-index: 8;
}


.command-item {

    color: #687064;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition:

        color .25s ease,
        text-shadow .25s ease;
}


.command-item:hover {

    color: #a9b59a;
}


.command-item.active {

    color: var(--gold);

    text-shadow:
        0 0 12px
        rgba(197,167,91,.22);
}


.separator {

    height: 15px;

    width: 1px;

    background: #323a30;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 35px 32px 30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;

    isolation: isolate;
}


.chat::-webkit-scrollbar {

    width: 8px;
}


.chat::-webkit-scrollbar-track {

    background: transparent;
}


.chat::-webkit-scrollbar-thumb {

    background: #30382f;

    border-radius: 10px;

    transition:
        background .2s ease;
}


.chat::-webkit-scrollbar-thumb:hover {

    background: #4a5647;
}


/* =========================================================
   MESSAGES
========================================================= */

.message {

    margin-bottom: 24px;

    display: flex;

    animation:
        messageIn .3s
        cubic-bezier(.2,.8,.2,1);
}


@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(12px)
            scale(.985);

        filter: blur(2px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


.message.user {

    justify-content: flex-end;
}


/* =========================================================
   BUBBLES
========================================================= */

.bubble {

    max-width: 78%;

    padding: 17px 20px;

    border-radius: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 16px;

    position: relative;

    transition:

        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}


.assistant .bubble {

    background:

        linear-gradient(
            145deg,
            rgba(23,31,23,.96),
            rgba(15,21,16,.96)
        );

    border: 1px solid #293329;

    color: #e5e8df;

    border-left:
        3px solid #667650;

    border-bottom-left-radius: 4px;
}


.assistant .bubble:hover {

    border-color: #3b4939;

    box-shadow:

        0 8px 30px
        rgba(0,0,0,.18),

        0 0 20px
        rgba(104,121,83,.035);

    transform:
        translateY(-1px);
}


.user .bubble {

    background:

        linear-gradient(
            145deg,
            #3b523b,
            #2b402f
        );

    border: 1px solid #4d644c;

    color: #f2f4ed;

    border-bottom-right-radius: 4px;
}


.user .bubble:hover {

    border-color: #60785e;

    box-shadow:

        0 8px 25px
        rgba(0,0,0,.18);

    transform:
        translateY(-1px);
}


/* =========================================================
   ASTRA LABEL
========================================================= */

.message.assistant::before {

    content: "ASTRA";

    position: absolute;

    margin-top: -19px;

    margin-left: 4px;

    font-size: 9px;

    letter-spacing: 1.5px;

    color: #77846b;

    text-shadow:
        0 0 10px
        rgba(127,145,96,.15);
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.welcome-content {

    position: relative;

    z-index: 3;
}


.welcome-emblem {

    width: 82px;

    height: 82px;

    margin:
        0 auto 20px;

    border:
        1px solid #685a38;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;

    background:

        radial-gradient(
            circle,
            #242b1d,
            #0d120d
        );

    box-shadow:

        0 0 35px
        rgba(197,167,91,.08);

    position: relative;

    overflow: hidden;

    animation:
        emblemFloat 4s ease-in-out infinite;
}


.welcome-emblem::after {

    content: "";

    position: absolute;

    width: 160%;

    height: 1px;

    left: -180%;

    top: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(224,199,125,.65),
            transparent
        );

    animation:
        emblemScan 3.5s linear infinite;
}


@keyframes emblemScan {

    0% {
        left: -180%;
    }

    100% {
        left: 180%;
    }
}


@keyframes emblemFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


.welcome h1 {

    font-size: 52px;

    letter-spacing: 11px;

    margin-bottom: 9px;

    color: #f1f2ed;

    text-shadow:

        0 0 15px
        rgba(255,255,255,.04),

        0 0 35px
        rgba(197,167,91,.04);

    animation:
        titleAppear .8s ease-out;
}


@keyframes titleAppear {

    from {

        opacity: 0;

        letter-spacing: 18px;

        transform:
            translateY(8px);
    }

    to {

        opacity: 1;

        letter-spacing: 11px;

        transform:
            translateY(0);
    }
}


.welcome .tagline {

    color: var(--gold);

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 17px;

    animation:
        taglineAppear 1s ease-out;
}


@keyframes taglineAppear {

    from {

        opacity: 0;

        transform:
            translateY(5px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.welcome p {

    color: #788174;

    font-size: 15px;

    max-width: 520px;

    line-height: 1.7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 20px;

    color: #7d8778;

    font-size: 13px;

    animation:
        typingAppear .25s ease-out;
}


@keyframes typingAppear {

    from {

        opacity: 0;

        transform:
            translateY(5px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.typing span.dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #82906f;

    animation:
        typing 1.1s infinite;
}


.typing span.dot:nth-child(2) {

    animation-delay:
        .15s;
}


.typing span.dot:nth-child(3) {

    animation-delay:
        .3s;
}


@keyframes typing {

    0%,
    60%,
    100% {

        opacity: .3;

        transform:
            translateY(0);
    }

    30% {

        opacity: 1;

        transform:
            translateY(-4px);
    }
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    min-height: 90px;

    padding: 15px 20px;

    display: flex;

    gap: 11px;

    background:

        linear-gradient(
            180deg,
            #0b100b,
            #090d09
        );

    border-top:
        1px solid #30382f;

    position: relative;

    z-index: 10;

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,.15);
}


.input-wrap {

    flex: 1;

    position: relative;
}


#messageInput {

    width: 100%;

    height: 58px;

    background: #0c120d;

    color: #f1f2ed;

    border:
        1px solid #394538;

    border-radius: 11px;

    padding: 0 18px;

    outline: none;

    font-size: 16px;

    transition:

        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}


#messageInput::placeholder {

    color: #697267;
}


#messageInput:focus {

    background: #0d140e;

    border-color:
        #788b5e;

    box-shadow:

        0 0 0 3px
        rgba(104,121,83,.08),

        0 0 25px
        rgba(104,121,83,.045);
}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    height: 58px;

    min-width: 105px;

    border:
        1px solid #77643a;

    border-radius: 11px;

    background:

        linear-gradient(
            145deg,
            #77643a,
            #5c4c2d
        );

    color: #fff8df;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.25);

    transition:

        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}


#sendButton::before {

    content: "";

    position: absolute;

    width: 70px;

    height: 180%;

    top: -40%;

    left: -100px;

    transform:
        rotate(20deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.16),
            transparent
        );

    animation:
        buttonScan 4s linear infinite;
}


@keyframes buttonScan {

    0% {
        left: -100px;
    }

    55%,
    100% {
        left: 150%;
    }
}


#sendButton:hover {

    background:

        linear-gradient(
            145deg,
            #8c7645,
            #6d5a34
        );

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 25px
        rgba(0,0,0,.35),

        0 0 18px
        rgba(197,167,91,.08);

    border-color:
        #9a824a;
}


#sendButton:active {

    transform:
        translateY(0);
}


#sendButton:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 750px) {

    body {
        overflow: hidden;
    }

    .app {

        width: 100%;

        height: 100vh;

        border-radius: 0;
    }


    header {

        height: 82px;

        padding:
            0 16px;
    }


    .brand {

        gap: 11px;
    }


    .brand-mark {

        width: 42px;

        height: 42px;

        font-size: 15px;
    }


    .astra {

        font-size: 25px;

        letter-spacing: 5px;
    }


    .subtitle {

        font-size: 8px;

        letter-spacing: 1.8px;
    }


    .system-status {

        display: none;
    }


    #newChatButton {

        padding:
            10px 12px;

        font-size: 12px;
    }


    .command-bar {

        padding:
            0 15px;

        gap: 12px;

        overflow: hidden;
    }


    .command-item {

        font-size: 8px;

        white-space: nowrap;
    }


    .chat {

        padding:
            28px 15px;
    }


    .bubble {

        max-width: 90%;

        font-size: 15px;
    }


    .welcome h1 {

        font-size: 40px;

        letter-spacing: 7px;
    }


    .welcome p {

        padding:
            0 20px;
    }


    .watermark {

        width: 350px;

        height: 350px;

        opacity: .075;

        animation: none;
    }


    .input-area {

        padding: 11px;
    }


    #messageInput {

        height: 53px;

        font-size: 15px;
    }


    #sendButton {

        height: 53px;

        min-width: 72px;
    }


    .app::after {

        animation-duration:
            30s;
    }


    #sendButton::before {

        animation-duration:
            6s;
    }
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- =====================================================
         OCA WATERMARK
    ====================================================== -->

    <div class="watermark"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>


        <div class="brand">


            <div class="brand-mark">
                OCA
            </div>


            <div class="brand-text">


                <div class="astra">
                    ASTRA
                </div>


                <div class="subtitle">
                    OCA • NDA PREPARATION AI
                </div>


            </div>


        </div>


        <div class="header-right">


            <div class="system-status">


                <span class="status-dot"></span>


                <span id="statusText">
                    SYSTEM ONLINE
                </span>


            </div>


            <button id="newChatButton">
                + New Chat
            </button>


        </div>


    </header>


    <!-- =====================================================
         COMMAND BAR
    ====================================================== -->

    <div class="command-bar">


        <span class="command-item active">
            ASTRA COMMAND
        </span>


        <span class="separator"></span>


        <span class="command-item">
            NDA PREPARATION
        </span>


        <span class="separator"></span>


        <span class="command-item">
            GAT
        </span>


        <span class="separator"></span>


        <span class="command-item">
            MATHEMATICS
        </span>


        <span class="separator"></span>


        <span class="command-item">
            CURRENT AFFAIRS
        </span>


        <span class="separator"></span>


        <span class="command-item">
            DEFENCE
        </span>


    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div
        class="chat"
        id="chat"
    >


        <div
            class="welcome"
            id="welcome"
        >


            <div class="welcome-content">


                <div class="welcome-emblem">
                    OCA
                </div>


                <h1>
                    ASTRA
                </h1>


                <div class="tagline">
                    NDA PREPARATION AI
                </div>


                <p>

                    Your intelligent academic assistant
                    for NDA preparation, mathematics,
                    GAT, current affairs and defence studies.

                </p>


            </div>


        </div>


    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">


        <div class="input-wrap">


            <input
                id="messageInput"
                type="text"
                placeholder="Enter your question for ASTRA..."
                autocomplete="off"
            >


        </div>


        <button id="sendButton">
            SEND
        </button>


    </div>


</div>


<script>


/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   CREATE CONVERSATION ID
========================================================= */

function createConversationId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }


    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(
            /[xy]/g,
            function(c) {

                const r =
                    Math.random() * 16 | 0;

                const v =
                    c === "x"
                    ? r
                    : (r & 0x3 | 0x8);

                return v.toString(16);
            }
        );
}


/* =========================================================
   CURRENT CONVERSATION
========================================================= */

let conversationId =
    localStorage.getItem(
        "astra_conversation_id"
    );


if (!conversationId) {

    conversationId =
        createConversationId();

    localStorage.setItem(
        "astra_conversation_id",
        conversationId
    );
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";
    }


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(
            function(element) {

                element.remove();
            }
        );


    if (welcome) {

        welcome.style.display =
            "flex";
    }
}


/* =========================================================
   LOAD CONVERSATION HISTORY
========================================================= */

async function loadHistory() {

    try {

        /*
         * IMPORTANT:
         * This endpoint is the conversation endpoint
         * already provided by your FastAPI backend.
         */

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        if (!response.ok) {

            /*
             * 404 simply means this is a new
             * conversation.
             */

            if (response.status === 404) {

                return;
            }

            throw new Error(
                "History request failed"
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(
                data.messages
            )
            ? data.messages
            : [];


        if (!messages.length) {

            return;
        }


        if (welcome) {

            welcome.style.display =
                "none";
        }


        messages.forEach(
            function(message) {

                addMessage(

                    message.content,

                    message.role === "user"
                        ? "user"
                        : "assistant"

                );

            }
        );


        chat.scrollTop =
            chat.scrollHeight;


    }
    catch (error) {

        console.log(
            "History could not be loaded:",
            error.message
        );
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {


        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation will remain saved."
            );


        if (!confirmation) {

            return;
        }


        conversationId =
            createConversationId();


        localStorage.setItem(
            "astra_conversation_id",
            conversationId
        );


        clearChatScreen();


        input.focus();

    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/health"
            );


        if (!response.ok) {

            throw new Error();
        }


        statusText.textContent =
            "SYSTEM ONLINE";


    }
    catch {

        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "typing";


    typing.innerHTML = `

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

        <span>
            ASTRA is processing...
        </span>

    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {


    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;


    input.disabled =
        true;


    const typing =
        createTyping();


    try {


        const response =
            await fetch(

                API_BASE +
                "/api/chat",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            conversation_id:
                                conversationId

                        })

                }

            );


        let data;


        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        typing.remove();


        if (!response.ok) {

            throw new Error(

                data.detail ||
                "ASTRA request failed"

            );
        }


        /*
         * IMPORTANT:
         * The backend returns the real
         * conversation ID.
         *
         * Save it so history continues
         * correctly even after reload.
         */

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(

                "astra_conversation_id",

                conversationId

            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        addMessage(
            answer,
            "assistant"
        );


    }
    catch (error) {


        typing.remove();


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"

        );

    }
    finally {


        sendButton.disabled =
            false;


        input.disabled =
            false;


        input.focus();

    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   START ASTRA
========================================================= */

loadHistory();

checkBackend();

input.focus();


</script>

</body>
</html>
