<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #05080c;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= APP ================= */

.app {
    width: 96%;
    max-width: 1350px;
    height: 94vh;

    background: rgba(7, 12, 18, 0.94);

    border: 1px solid #303b47;
    border-radius: 22px;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 0 50px rgba(255,255,255,.015);

    position: relative;
}

/* ================= WATERMARK ================= */

.app::before {
    content: "";

    position: absolute;

    width: 480px;
    height: 480px;

    left: 50%;
    top: 54%;

    transform: translate(-50%, -50%);

    background-image: url("logo.png");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;

    opacity: 0.075;

    pointer-events: none;

    z-index: 0;
}

/* ================= HEADER ================= */

header {
    height: 105px;

    padding: 0 28px;

    border-bottom: 1px solid #303b47;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 5;

    background: rgba(6, 10, 15, .88);
    backdrop-filter: blur(15px);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 18px;
}

.logo-text {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 8px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #9ca9b7
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.status {
    font-size: 17px;
    color: #4ade80;

    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 9px;
    height: 9px;

    background: #4ade80;

    border-radius: 50%;

    box-shadow: 0 0 12px #4ade80;
}

/* ================= NEW CHAT ================= */

#newChatButton {
    background: rgba(20, 29, 40, .9);

    color: #ffffff;

    border: 1px solid #465362;

    border-radius: 12px;

    padding: 13px 20px;

    font-size: 16px;

    cursor: pointer;

    transition: .2s;
}

#newChatButton:hover {
    background: #1c2a3a;
    border-color: #6b7b8d;
}

/* ================= CHAT ================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 35px 30px 30px;

    position: relative;
    z-index: 2;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 8px;
}

.chat::-webkit-scrollbar-track {
    background: transparent;
}

.chat::-webkit-scrollbar-thumb {
    background: #283441;
    border-radius: 10px;
}

.message {
    margin-bottom: 22px;

    display: flex;

    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 76%;

    padding: 16px 20px;

    border-radius: 18px;

    line-height: 1.65;

    white-space: pre-wrap;

    font-size: 17px;

    word-wrap: break-word;
}

.assistant .bubble {
    background: rgba(18, 26, 35, .94);

    border: 1px solid rgba(70, 84, 100, .25);

    color: #e4e9ef;

    border-bottom-left-radius: 6px;
}

.user .bubble {
    background: linear-gradient(
        135deg,
        #244b75,
        #315f91
    );

    color: white;

    border-bottom-right-radius: 6px;

    box-shadow: 0 5px 20px rgba(20,70,120,.18);
}

/* ================= WELCOME ================= */

.welcome {
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
}

.welcome-content {
    position: relative;
    z-index: 2;
}

.welcome h1 {
    font-size: 65px;

    letter-spacing: 12px;

    margin-bottom: 12px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #8997a7
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome p {
    color: #8d99a6;
    font-size: 18px;
}

/* ================= TYPING ================= */

.typing {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-bottom: 20px;

    color: #8f9baa;

    font-size: 15px;
}

.typing span {
    width: 7px;
    height: 7px;

    background: #7d8b9a;

    border-radius: 50%;

    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: .3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* ================= INPUT ================= */

.input-area {
    min-height: 92px;

    padding: 16px 20px;

    border-top: 1px solid #303b47;

    display: flex;

    gap: 12px;

    position: relative;

    z-index: 5;

    background: rgba(6, 10, 15, .92);

    backdrop-filter: blur(15px);
}

#messageInput {
    flex: 1;

    background: #0b1118;

    color: white;

    border: 1px solid #344250;

    border-radius: 14px;

    padding: 15px 17px;

    outline: none;

    font-size: 17px;

    transition: .2s;
}

#messageInput:focus {
    border-color: #557da8;

    box-shadow:
        0 0 0 3px rgba(49,93,145,.12);
}

#sendButton {
    border: none;

    border-radius: 14px;

    padding: 0 26px;

    background: linear-gradient(
        135deg,
        #315d91,
        #244d7c
    );

    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: .2s;
}

#sendButton:hover {
    transform: translateY(-1px);

    background: linear-gradient(
        135deg,
        #3b6fa9,
        #2d5d91
    );
}

#sendButton:disabled {
    opacity: .5;

    cursor: not-allowed;

    transform: none;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    header {
        height: 82px;
        padding: 0 18px;
    }

    .logo-text {
        font-size: 28px;
        letter-spacing: 5px;
    }

    .status {
        font-size: 13px;
    }

    #newChatButton {
        padding: 10px 12px;
        font-size: 13px;
    }

    .chat {
        padding: 25px 16px;
    }

    .bubble {
        max-width: 90%;
        font-size: 16px;
    }

    .welcome h1 {
        font-size: 45px;
    }

    .input-area {
        padding: 12px;
    }

    #sendButton {
        padding: 0 18px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="logo-area">

            <div class="logo-text">
                ASTRA
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">Checking...</span>
            </div>

        </div>

        <button id="newChatButton">
            + New Chat
        </button>

    </header>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <h1>ASTRA</h1>

                <p>
                    Your intelligent AI assistant
                </p>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Message ASTRA..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   CHAT HISTORY
========================================================= */

/*
   This is the important part.

   ASTRA now saves messages inside the browser.

   When you refresh the website,
   the previous messages are loaded again.
*/

let chatHistory =
    JSON.parse(
        localStorage.getItem("astra_chat_history")
    ) || [];


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    localStorage.setItem(
        "astra_chat_history",
        JSON.stringify(chatHistory)
    );

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type,
    save = true
) {

    if (welcome) {
        welcome.style.display = "none";
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(bubble);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;


    /*
       Save message to history
    */

    if (save) {

        chatHistory.push({
            role:
                type === "user"
                    ? "user"
                    : "assistant",

            text: text,

            time:
                new Date().toISOString()
        });


        saveHistory();
    }

}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

function loadHistory() {

    if (!chatHistory.length) {
        return;
    }


    if (welcome) {
        welcome.style.display = "none";
    }


    for (
        const message of chatHistory
    ) {

        addMessage(
            message.text,
            message.role === "user"
                ? "user"
                : "assistant",
            false
        );

    }


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function () {

        const confirmNew =
            confirm(
                "Start a new chat?\n\nYour current chat history will be cleared."
            );


        if (!confirmNew) {
            return;
        }


        chatHistory = [];


        localStorage.removeItem(
            "astra_chat_history"
        );


        /*
           Remove all messages
        */

        chat.querySelectorAll(
            ".message, .typing"
        ).forEach(
            element => element.remove()
        );


        /*
           Show welcome screen
        */

        if (welcome) {
            welcome.style.display = "flex";
        }


        input.focus();

    }
);


/* =========================================================
   CHECK BACKEND
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE + "/health"
            );


        if (!response.ok) {
            throw new Error(
                "Backend unavailable"
            );
        }


        statusText.textContent =
            "Online";

    }

    catch (error) {

        statusText.textContent =
            "Offline";

    }

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
        <span>ASTRA is thinking...</span>
    `;


    chat.appendChild(typing);

    chat.scrollTop =
        chat.scrollHeight;


    return typing;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    /*
       Show user's message
    */

    addMessage(
        message,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;
    input.disabled = true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(
                API_BASE + "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })
                }
            );


        let data;

        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );

        }


        typing.remove();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Request failed"
            );

        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        /*
           Add answer and save it
        */

        addMessage(
            answer,
            "assistant"
        );


    }

    catch (error) {

        typing.remove();


        addMessage(
            "Sorry, I couldn't connect to ASTRA right now.\n\nError: " +
            error.message,
            "assistant"
        );

    }

    finally {

        sendButton.disabled = false;

        input.disabled = false;

        input.focus();

    }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   START ASTRA
========================================================= */

loadHistory();

checkBackend();

input.focus();

</script>

</body>
</html>
