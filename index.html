<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA | OCA NDA AI</title>

<style>

/* =========================================================
   ASTRA OCA — FUTURISTIC DEFENCE AI
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050805;
    --panel: #0b110c;
    --panel2: #101810;

    --border: #303b30;

    --olive: #596642;
    --olive-light: #8fa46c;

    --gold: #c5a75b;
    --gold-light: #ead18a;

    --white: #f2f4ef;
    --muted: #7f897d;

    --user: #304b35;
    --assistant: #121b13;

    --green: #54d77b;
}


/* =========================================================
   BODY
========================================================= */

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(100, 130, 70, .16),
            transparent 42%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(197,167,91,.05),
            transparent 35%
        ),
        #050805;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================================================
   AMBIENT GLOW
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(113,145,78,.08),
            transparent 65%
        );

    pointer-events: none;

    animation:
        ambientPulse 6s ease-in-out infinite;

    z-index: 0;
}

@keyframes ambientPulse {

    0%,
    100% {
        opacity: .55;
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}


/* =========================================================
   APP
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:
        linear-gradient(
            145deg,
            rgba(14,21,15,.97),
            rgba(5,9,6,.985)
        );

    border: 1px solid #3b4939;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    position: relative;

    box-shadow:
        0 35px 110px rgba(0,0,0,.75),
        inset 0 0 100px rgba(255,255,255,.012);

    isolation: isolate;
}


/* =========================================================
   FUTURISTIC GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .24;

    z-index: 0;

    animation:
        gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {
        background-position:
            0 0,
            0 0;
    }

    to {
        background-position:
            45px 45px,
            45px 45px;
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}

.particle {

    position: absolute;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background: rgba(210,225,185,.65);

    box-shadow:
        0 0 8px rgba(160,190,120,.4);

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat {

    from {
        transform:
            translateY(110vh)
            translateX(0);

        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    90% {
        opacity: .7;
    }

    to {
        transform:
            translateY(-10vh)
            translateX(35px);

        opacity: 0;
    }
}


/* =========================================================
   OCA WATERMARK
========================================================= */

.watermark {

    position: absolute;

    width: 560px;
    height: 560px;

    left: 50%;
    top: 53%;

    transform:
        translate(-50%, -50%);

    background-image:
        url("logo.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    opacity: .085;

    filter:
        grayscale(100%)
        brightness(2.15)
        contrast(1.1);

    pointer-events: none;

    z-index: 2;

    animation:
        watermarkPulse 7s ease-in-out infinite;
}

@keyframes watermarkPulse {

    0%,
    100% {
        opacity: .065;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        opacity: .105;

        transform:
            translate(-50%, -50%)
            scale(1.025);
    }
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding:
        0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            180deg,
            rgba(18,26,18,.985),
            rgba(8,13,9,.97)
        );

    border-bottom:
        1px solid #394538;

    position: relative;

    z-index: 10;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}

.brand-mark {

    width: 52px;
    height: 52px;

    border:
        1px solid #70623d;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-weight: bold;

    font-size: 19px;

    letter-spacing: 2px;

    background:
        linear-gradient(
            145deg,
            #222a1d,
            #0c120d
        );

    box-shadow:
        inset 0 0 20px rgba(197,167,91,.07),
        0 0 20px rgba(197,167,91,.04);

    transition: .3s;
}

.brand-mark:hover {

    border-color: var(--gold);

    box-shadow:
        0 0 20px rgba(197,167,91,.14);
}

.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;

    color: #f3f3ef;

    text-shadow:
        0 0 18px rgba(255,255,255,.06);
}

.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);

    text-transform: uppercase;
}


/* =========================================================
   HEADER RIGHT
========================================================= */

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;
}

.system-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #9cdaa9;

    font-size: 13px;

    letter-spacing: 1px;
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 8px rgba(84,215,123,.8),
        0 0 18px rgba(84,215,123,.35);

    animation:
        statusPulse 2s ease-in-out infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(.72);
        opacity: .55;
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

#newChatButton {

    padding:
        12px 19px;

    background:
        linear-gradient(
            145deg,
            #1c271a,
            #101610
        );

    color: #dddccf;

    border:
        1px solid #4c5847;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    letter-spacing: .5px;

    transition: .25s;

    position: relative;

    overflow: hidden;
}

#newChatButton::before {

    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transition: .5s;
}

#newChatButton:hover::before {
    left: 100%;
}

#newChatButton:hover {

    border-color: var(--gold);

    color: white;

    background:
        #222d1f;

    box-shadow:
        0 0 18px rgba(197,167,91,.06);
}


/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding:
        0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background:
        rgba(7,12,8,.92);

    border-bottom:
        1px solid #252e25;

    position: relative;

    z-index: 8;
}

.command-item {

    color: #687265;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition: .25s;
}

.command-item:hover {

    color: #9ca98e;
}

.command-item.active {

    color: var(--gold);

    text-shadow:
        0 0 12px rgba(197,167,91,.2);
}

.separator {

    height: 15px;

    width: 1px;

    background:
        #323a30;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        35px 32px 30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 8px;
}

.chat::-webkit-scrollbar-track {
    background: transparent;
}

.chat::-webkit-scrollbar-thumb {

    background:
        #30382f;

    border-radius: 10px;
}

.chat::-webkit-scrollbar-thumb:hover {

    background:
        #4c5948;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    margin-bottom: 25px;

    display: flex;

    position: relative;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform:
            translateY(10px)
            scale(.985);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.message.user {

    justify-content:
        flex-end;
}

.bubble {

    max-width: 78%;

    padding:
        17px 20px;

    border-radius:
        14px;

    line-height:
        1.65;

    white-space:
        pre-wrap;

    word-wrap:
        break-word;

    font-size:
        16px;

    position:
        relative;

    backdrop-filter:
        blur(8px);
}


/* =========================================================
   ASSISTANT
========================================================= */

.assistant .bubble {

    background:
        linear-gradient(
            145deg,
            rgba(23,32,23,.94),
            rgba(12,19,13,.94)
        );

    border:
        1px solid #2c382c;

    color:
        #e5e8df;

    border-left:
        3px solid #71835b;

    border-bottom-left-radius:
        4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.12);
}


/* =========================================================
   USER
========================================================= */

.user .bubble {

    background:
        linear-gradient(
            145deg,
            #3a543e,
            #293f2e
        );

    border:
        1px solid #50694e;

    color:
        #f2f4ed;

    border-bottom-right-radius:
        4px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.14);
}


/* =========================================================
   ASSISTANT LABEL
========================================================= */

.message.assistant::before {

    content:
        "ASTRA";

    position:
        absolute;

    margin-top:
        -18px;

    margin-left:
        4px;

    font-size:
        9px;

    letter-spacing:
        1.5px;

    color:
        #7e8e70;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;
}

.welcome-content {

    position:
        relative;

    z-index:
        3;

    animation:
        welcomeIn .8s ease;
}

@keyframes welcomeIn {

    from {
        opacity: 0;
        transform:
            translateY(15px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.welcome-emblem {

    width:
        82px;

    height:
        82px;

    margin:
        0 auto 20px;

    border:
        1px solid #75633b;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        var(--gold);

    font-size:
        22px;

    font-weight:
        bold;

    letter-spacing:
        2px;

    background:
        radial-gradient(
            circle,
            #252d1d,
            #0b110c
        );

    box-shadow:
        0 0 25px rgba(197,167,91,.08),
        inset 0 0 25px rgba(197,167,91,.04);

    animation:
        emblemPulse 4s ease-in-out infinite;
}

@keyframes emblemPulse {

    0%,
    100% {
        box-shadow:
            0 0 25px rgba(197,167,91,.07),
            inset 0 0 25px rgba(197,167,91,.03);
    }

    50% {
        box-shadow:
            0 0 40px rgba(197,167,91,.14),
            inset 0 0 30px rgba(197,167,91,.06);
    }
}

.welcome h1 {

    font-size:
        52px;

    letter-spacing:
        11px;

    margin-bottom:
        9px;

    color:
        #f1f2ed;

    text-shadow:
        0 0 25px rgba(255,255,255,.05);
}

.welcome .tagline {

    color:
        var(--gold);

    font-size:
        12px;

    letter-spacing:
        3px;

    text-transform:
        uppercase;

    margin-bottom:
        17px;
}

.welcome p {

    color:
        #788174;

    font-size:
        15px;

    max-width:
        520px;

    line-height:
        1.7;
}


/* =========================================================
   FUTURISTIC TYPING
========================================================= */

.typing {

    width:
        fit-content;

    display:
        flex;

    align-items:
        center;

    gap:
        7px;

    margin-bottom:
        20px;

    padding:
        11px 15px;

    background:
        rgba(15,24,16,.75);

    border:
        1px solid #29362a;

    border-radius:
        10px;

    color:
        #7f8d79;

    font-size:
        12px;

    letter-spacing:
        .5px;

    backdrop-filter:
        blur(7px);

    animation:
        processingIn .25s ease;
}

@keyframes processingIn {

    from {
        opacity: 0;
        transform:
            translateY(5px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.typing span.dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #92a875;

    box-shadow:
        0 0 8px rgba(146,168,117,.45);

    animation:
        typing 1.1s infinite;
}

.typing span.dot:nth-child(2) {
    animation-delay: .15s;
}

.typing span.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        opacity: .3;
        transform:
            translateY(0);
    }

    30% {
        opacity: 1;
        transform:
            translateY(-4px);
    }
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    min-height:
        90px;

    padding:
        15px 20px;

    display:
        flex;

    gap:
        11px;

    background:
        linear-gradient(
            180deg,
            #0b100b,
            #080c08
        );

    border-top:
        1px solid #30382f;

    position:
        relative;

    z-index:
        10;
}

.input-wrap {

    flex:
        1;

    position:
        relative;
}

#messageInput {

    width:
        100%;

    height:
        58px;

    background:
        rgba(10,17,11,.94);

    color:
        #f1f2ed;

    border:
        1px solid #394538;

    border-radius:
        11px;

    padding:
        0 18px;

    outline:
        none;

    font-size:
        16px;

    transition:
        .25s;

    backdrop-filter:
        blur(10px);
}

#messageInput::placeholder {

    color:
        #697267;
}

#messageInput:focus {

    border-color:
        #72835b;

    box-shadow:
        0 0 0 3px rgba(104,121,83,.08),
        0 0 20px rgba(104,121,83,.04);
}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    height:
        58px;

    min-width:
        105px;

    border:
        1px solid #77643a;

    border-radius:
        11px;

    background:
        linear-gradient(
            145deg,
            #77643a,
            #5c4c2d
        );

    color:
        #fff8df;

    font-size:
        15px;

    font-weight:
        600;

    cursor:
        pointer;

    transition:
        .25s;

    position:
        relative;

    overflow:
        hidden;
}

#sendButton::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        -120%;

    width:
        100%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transition:
        .55s;
}

#sendButton:hover::before {
    left: 120%;
}

#sendButton:hover {

    background:
        linear-gradient(
            145deg,
            #8c7645,
            #6d5a34
        );

    transform:
        translateY(-1px);

    box-shadow:
        0 8px 25px rgba(197,167,91,.08);
}

#sendButton:disabled {

    opacity:
        .5;

    cursor:
        not-allowed;

    transform:
        none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 750px) {

    body {
        overflow:
            hidden;
    }

    .app {

        width:
            100%;

        height:
            100vh;

        border-radius:
            0;
    }

    header {

        height:
            82px;

        padding:
            0 16px;
    }

    .brand-mark {

        width:
            42px;

        height:
            42px;

        font-size:
            15px;
    }

    .astra {

        font-size:
            25px;

        letter-spacing:
            5px;
    }

    .subtitle {

        font-size:
            8px;

        letter-spacing:
            1.8px;
    }

    .system-status {

        display:
            none;
    }

    #newChatButton {

        padding:
            10px 12px;

        font-size:
            12px;
    }

    .command-bar {

        padding:
            0 15px;

        gap:
            12px;

        overflow:
            hidden;
    }

    .command-item {

        font-size:
            8px;

        white-space:
            nowrap;
    }

    .chat {

        padding:
            28px 15px;
    }

    .bubble {

        max-width:
            90%;

        font-size:
            15px;
    }

    .welcome h1 {

        font-size:
            40px;

        letter-spacing:
            7px;
    }

    .watermark {

        width:
            350px;

        height:
            350px;
    }

    .input-area {

        padding:
            11px;
    }

    #messageInput {

        height:
            53px;

        font-size:
            15px;
    }

    #sendButton {

        height:
            53px;

        min-width:
            72px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- =====================================================
         PARTICLES
    ====================================================== -->

    <div class="particles" id="particles"></div>


    <!-- =====================================================
         OCA WATERMARK
    ====================================================== -->

    <div class="watermark"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="brand">

            <div class="brand-mark">
                OCA
            </div>

            <div class="brand-text">

                <div class="astra">
                    ASTRA
                </div>

                <div class="subtitle">
                    OCA • NDA PREPARATION AI
                </div>

            </div>

        </div>


        <div class="header-right">

            <div class="system-status">

                <span class="status-dot"></span>

                <span id="statusText">
                    SYSTEM ONLINE
                </span>

            </div>


            <button id="newChatButton">
                + New Chat
            </button>

        </div>

    </header>


    <!-- =====================================================
         COMMAND BAR
    ====================================================== -->

    <div class="command-bar">

        <span class="command-item active">
            ASTRA COMMAND
        </span>

        <span class="separator"></span>

        <span class="command-item">
            NDA PREPARATION
        </span>

        <span class="separator"></span>

        <span class="command-item">
            GAT
        </span>

        <span class="separator"></span>

        <span class="command-item">
            MATHEMATICS
        </span>

        <span class="separator"></span>

        <span class="command-item">
            CURRENT AFFAIRS
        </span>

        <span class="separator"></span>

        <span class="command-item">
            DEFENCE
        </span>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <div class="welcome-emblem">
                    OCA
                </div>

                <h1>
                    ASTRA
                </h1>

                <div class="tagline">
                    NDA PREPARATION AI
                </div>

                <p>
                    Your intelligent academic assistant
                    for NDA preparation, mathematics,
                    GAT, current affairs and defence studies.
                </p>

            </div>

        </div>

    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">

        <div class="input-wrap">

            <input
                id="messageInput"
                type="text"
                placeholder="Enter your question for ASTRA..."
                autocomplete="off"
            >

        </div>


        <button id="sendButton">
            SEND
        </button>

    </div>

</div>


<script>

/* =========================================================
   ASTRA BACKEND
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");

const particles =
    document.getElementById("particles");


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    if (!particles) {
        return;
    }

    const particleCount =
        window.innerWidth < 750
            ? 18
            : 35;

    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            (12 + Math.random() * 18) + "s";

        particle.style.animationDelay =
            (-Math.random() * 20) + "s";

        particle.style.opacity =
            (.15 + Math.random() * .55).toString();

        particles.appendChild(
            particle
        );
    }
}

createParticles();


/* =========================================================
   CONVERSATION ID
========================================================= */

function createConversationId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(
            /[xy]/g,
            function(c) {

                const r =
                    Math.random() * 16 | 0;

                const v =
                    c === "x"
                        ? r
                        : (r & 0x3 | 0x8);

                return v.toString(16);
            }
        );
}


/* =========================================================
   GET CURRENT CONVERSATION
========================================================= */

let conversationId =
    localStorage.getItem(
        "astra_conversation_id"
    );


if (!conversationId) {

    conversationId =
        createConversationId();

    localStorage.setItem(
        "astra_conversation_id",
        conversationId
    );
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR CHAT SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(
            function(element) {

                element.remove();
            }
        );


    if (welcome) {

        welcome.style.display =
            "flex";
    }
}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory() {

    try {

        /*
         * IMPORTANT:
         * Your backend currently exposes:
         *
         * GET /api/conversations/{conversation_id}
         *
         * So we use that endpoint.
         */

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        if (!response.ok) {

            /*
             * A new conversation may not
             * exist in the database yet.
             */

            if (
                response.status === 404
            ) {

                return;
            }

            throw new Error(
                "History request failed"
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];


        if (!messages.length) {

            return;
        }


        if (welcome) {

            welcome.style.display =
                "none";
        }


        messages.forEach(
            function(message) {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "assistant"
                );
            }
        );


        chat.scrollTop =
            chat.scrollHeight;

    }
    catch (error) {

        console.log(
            "History could not be loaded:",
            error.message
        );
    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {

        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation " +
                "will remain saved."
            );


        if (!confirmation) {

            return;
        }


        conversationId =
            createConversationId();


        localStorage.setItem(
            "astra_conversation_id",
            conversationId
        );


        clearChatScreen();


        input.focus();
    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE + "/health"
            );


        if (!response.ok) {

            throw new Error();
        }


        statusText.textContent =
            "SYSTEM ONLINE";

    }
    catch {

        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML = `

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

        <span>
            ASTRA is processing...
        </span>

    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value =
        "";


    sendButton.disabled =
        true;

    input.disabled =
        true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(
                API_BASE + "/api/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message,

                            conversation_id:
                                conversationId
                        })
                }
            );


        let data;


        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        typing.remove();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "ASTRA request failed"
            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        /*
         * IMPORTANT:
         * Backend can return the real
         * conversation ID.
         */

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(
                "astra_conversation_id",
                conversationId
            );
        }


        addMessage(
            answer,
            "assistant"
        );

    }
    catch (error) {

        typing.remove();


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"

        );

    }
    finally {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   START ASTRA
========================================================= */

loadHistory();

checkBackend();

input.focus();

</script>

</body>
</html>
