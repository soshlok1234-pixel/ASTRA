<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ASTRA | OCA NDA AI</title>


<style>

/* =========================================================
   ASTRA OCA
   TEMPORARY CHAT MEMORY
   NO CHAT HISTORY
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


:root {

    --bg: #080b08;
    --panel: #0d120e;
    --panel2: #111811;

    --border: #30382f;

    --olive: #596642;
    --olive-light: #7f9160;

    --gold: #c5a75b;
    --gold-light: #e0c77d;

    --white: #f1f2ed;
    --muted: #929a8d;

    --user: #344b35;
    --assistant: #151d16;

    --green: #54c477;
}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(93,111,67,.16),
            transparent 42%
        ),
        #080b08;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =========================================================
   APP
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:
        linear-gradient(
            145deg,
            rgba(16,22,16,.98),
            rgba(7,10,8,.99)
        );

    border: 1px solid #3b4337;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    position: relative;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 0 80px rgba(255,255,255,.015);
}


/* =========================================================
   GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .18;

    z-index: 0;
}


/* =========================================================
   LOGO WATERMARK
========================================================= */

.watermark {

    position: absolute;

    width: 560px;

    height: 560px;

    left: 58%;

    top: 55%;

    transform:
        translate(-50%, -50%);

    background-image:
        url("logo.png");

    background-size:
        contain;

    background-position:
        center;

    background-repeat:
        no-repeat;

    opacity: .075;

    filter:
        grayscale(100%)
        brightness(1.9);

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   MAIN
========================================================= */

.main {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;

    z-index: 5;
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            180deg,
            rgba(18,24,18,.98),
            rgba(10,14,10,.96)
        );

    border-bottom:
        1px solid #394236;

    position: relative;

    z-index: 10;
}


.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}


.brand-mark {

    width: 52px;

    height: 52px;

    border: 1px solid #70623d;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-weight: bold;

    font-size: 16px;

    letter-spacing: 2px;

    background:
        linear-gradient(
            145deg,
            #20271c,
            #0e130e
        );
}


.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}


.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;
}


.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);
}


.header-right {

    display: flex;

    align-items: center;
}


.system-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #8fd49e;

    font-size: 12px;

    letter-spacing: 1px;
}


.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px rgba(84,196,119,.8);
}


/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background: #0b100b;

    border-bottom:
        1px solid #252c24;

    overflow: hidden;
}


.command-item {

    color: #687064;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    white-space: nowrap;
}


.command-item.active {

    color: var(--gold);
}


.separator {

    height: 15px;

    width: 1px;

    background: #323a30;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 35px 32px 30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;
}


.chat::-webkit-scrollbar {

    width: 8px;
}


.chat::-webkit-scrollbar-thumb {

    background: #30382f;

    border-radius: 10px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    margin-bottom: 24px;

    display: flex;

    animation:
        messageIn .22s ease;
}


@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(7px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.message.user {

    justify-content:
        flex-end;
}


.bubble {

    max-width: 78%;

    padding: 17px 20px;

    border-radius: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 16px;
}


.assistant .bubble {

    background:
        linear-gradient(
            145deg,
            rgba(23,31,23,.96),
            rgba(15,21,16,.96)
        );

    border:
        1px solid #293329;

    color: #e5e8df;

    border-left:
        3px solid #667650;

    border-bottom-left-radius:
        4px;
}


.user .bubble {

    background:
        linear-gradient(
            145deg,
            #3b523b,
            #2b402f
        );

    border:
        1px solid #4d644c;

    color: #f2f4ed;

    border-bottom-right-radius:
        4px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.welcome-content {

    position: relative;

    z-index: 3;
}


.welcome-emblem {

    width: 82px;

    height: 82px;

    margin:
        0 auto 20px;

    border:
        1px solid #685a38;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;
}


.welcome h1 {

    font-size: 52px;

    letter-spacing: 11px;

    margin-bottom: 9px;
}


.welcome .tagline {

    color: var(--gold);

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 17px;
}


.welcome p {

    color: #788174;

    font-size: 15px;

    max-width: 520px;

    line-height: 1.7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 20px;

    color: #7d8778;

    font-size: 13px;
}


.typing .dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #82906f;

    animation:
        typing 1.1s infinite;
}


.typing .dot:nth-child(2) {

    animation-delay:
        .15s;
}


.typing .dot:nth-child(3) {

    animation-delay:
        .3s;
}


@keyframes typing {

    0%,60%,100% {

        opacity: .3;

        transform:
            translateY(0);
    }

    30% {

        opacity: 1;

        transform:
            translateY(-4px);
    }
}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    min-height: 90px;

    padding:
        15px 20px;

    display: flex;

    gap: 11px;

    background:
        linear-gradient(
            180deg,
            #0b100b,
            #090d09
        );

    border-top:
        1px solid #30382f;
}


.input-wrap {

    flex: 1;
}


#messageInput {

    width: 100%;

    height: 58px;

    background: #0c120d;

    color: #f1f2ed;

    border:
        1px solid #394538;

    border-radius: 11px;

    padding:
        0 18px;

    outline: none;

    font-size: 16px;
}


#messageInput:focus {

    border-color:
        #687953;

    box-shadow:
        0 0 0 3px
        rgba(104,121,83,.08);
}


#messageInput::placeholder {

    color: #697267;
}


#sendButton {

    height: 58px;

    min-width: 105px;

    border:
        1px solid #77643a;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #77643a,
            #5c4c2d
        );

    color: #fff8df;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}


#sendButton:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px) {

    body {

        align-items:
            stretch;
    }


    .app {

        width: 100%;

        height: 100vh;

        border-radius: 0;
    }


    header {

        height: 82px;

        padding:
            0 15px;
    }


    .brand-mark {

        width: 42px;

        height: 42px;
    }


    .astra {

        font-size: 25px;

        letter-spacing: 5px;
    }


    .subtitle {

        font-size: 8px;
    }


    .system-status {

        display: none;
    }


    .command-bar {

        padding:
            0 15px;

        gap: 12px;
    }


    .chat {

        padding:
            28px 15px;
    }


    .bubble {

        max-width: 90%;

        font-size: 15px;
    }


    .welcome h1 {

        font-size: 40px;

        letter-spacing: 7px;
    }


    .watermark {

        width: 350px;

        height: 350px;
    }


    .input-area {

        padding:
            12px;
    }


    #sendButton {

        min-width: 82px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         LOGO WATERMARK
    ====================================================== -->

    <div class="watermark"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header>

            <div class="brand">

                <div class="brand-mark">
                    OCA
                </div>

                <div class="brand-text">

                    <div class="astra">
                        ASTRA
                    </div>

                    <div class="subtitle">
                        OCA • NDA PREPARATION AI
                    </div>

                </div>

            </div>


            <div class="header-right">

                <div class="system-status">

                    <span
                        class="status-dot"
                    ></span>

                    <span id="statusText">
                        CONNECTING...
                    </span>

                </div>

            </div>

        </header>


        <!-- COMMAND BAR -->

        <div class="command-bar">

            <span class="command-item active">
                ASTRA COMMAND
            </span>

            <span class="separator"></span>

            <span class="command-item">
                NDA PREPARATION
            </span>

            <span class="separator"></span>

            <span class="command-item">
                GAT
            </span>

            <span class="separator"></span>

            <span class="command-item">
                MATHEMATICS
            </span>

            <span class="separator"></span>

            <span class="command-item">
                CURRENT AFFAIRS
            </span>

            <span class="separator"></span>

            <span class="command-item">
                DEFENCE
            </span>

        </div>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-content">

                    <div class="welcome-emblem">
                        OCA
                    </div>

                    <h1>
                        ASTRA
                    </h1>

                    <div class="tagline">
                        NDA PREPARATION AI
                    </div>

                    <p>
                        Your intelligent academic
                        assistant for NDA preparation,
                        mathematics, GAT, current
                        affairs and defence studies.
                    </p>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-wrap">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Enter your question for ASTRA..."
                    autocomplete="off"
                >

            </div>

            <button
                id="sendButton"
            >
                SEND
            </button>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ASTRA FRONTEND
   TEMPORARY MEMORY ONLY
========================================================= */


const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const welcome =
    document.getElementById(
        "welcome"
    );


/* =========================================================
   IMPORTANT
   THIS ARRAY IS THE ONLY CHAT MEMORY.
   IT EXISTS ONLY WHILE THIS PAGE IS OPEN.
========================================================= */

let conversation = [];


/* =========================================================
   ADD MESSAGE TO SCREEN
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";
    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text == null
            ? ""
            : String(text);


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   TYPING
========================================================= */

function createTyping() {

    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "typing";


    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   CHECK BACKEND
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/health"
            );


        if (!response.ok) {

            throw new Error(
                "Backend unavailable"
            );
        }


        const data =
            await response.json();


        if (
            data.gemini &&
            data.langsearch
        ) {

            statusText.textContent =
                "SYSTEM ONLINE";

        } else {

            statusText.textContent =
                "SYSTEM PARTIAL";
        }


    } catch (error) {

        console.error(
            "Health error:",
            error
        );


        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (
        !message ||
        sendButton.disabled
    ) {

        return;
    }


    /* Show user message */

    addMessage(
        message,
        "user"
    );


    /* Add to temporary memory */

    conversation.push({

        role: "user",

        content: message

    });


    input.value = "";

    input.disabled = true;

    sendButton.disabled = true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(

                API_BASE +
                "/api/chat",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                conversation

                        })

                }

            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        if (!response.ok) {

            throw new Error(

                data.detail ||
                (
                    "ASTRA request failed (" +
                    response.status +
                    ")"
                )

            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        typing.remove();


        /* Show ASTRA response */

        addMessage(
            answer,
            "assistant"
        );


        /* Add ASTRA response to temporary memory */

        conversation.push({

            role: "assistant",

            content: answer

        });


    } catch (error) {

        typing.remove();


        console.error(
            "ASTRA error:",
            error
        );


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"

        );

    } finally {

        input.disabled = false;

        sendButton.disabled = false;

        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   START
========================================================= */

checkBackend();

input.focus();

</script>

</body>

</html>
