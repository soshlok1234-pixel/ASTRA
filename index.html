<!-- =========================================================
     MATHJAX
     Renders Gemini LaTeX mathematics properly
========================================================= -->

<script>
window.MathJax = {

    tex: {

        inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"]
        ],

        displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"]
        ],

        processEscapes: true,

        processEnvironments: true
    },

    options: {

        skipHtmlTags: [
            "script",
            "noscript",
            "style",
            "textarea",
            "pre",
            "code"
        ]
    },

    startup: {

        typeset: false
    }

};
</script>

<body>


<div class="app">


    <!-- =====================================================

    <div class="watermark"></div>


    <!-- =====================================================

    ====================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header>

            </span>

<script>

/* =========================================================
   ASTRA FRONTEND
   TEMPORARY MEMORY ONLY
   NO LOCAL STORAGE
   NO DATABASE
========================================================= */


/* =========================================================
   API
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const welcome =
    document.getElementById(
        "welcome"
    );


/* =========================================================
   TEMPORARY MEMORY
   RAM ONLY
   DELETED WHEN PAGE IS REFRESHED/CLOSED
========================================================= */

let conversation = [];


/* =========================================================
   ESCAPE HTML
   Prevents AI response from inserting unsafe HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   FORMAT AI TEXT
   Keeps LaTeX intact for MathJax
========================================================= */

function formatAIText(text) {

    let safe =
        escapeHTML(text);


    /*
       Convert simple Markdown bold.

       Example:

       **Answer:** 4

       becomes:

       <strong>Answer:</strong> 4
    */

    safe =
        safe.replace(
            /\*\*(.+?)\*\*/gs,
            "<strong>$1</strong>"
        );


    /*
       Convert Markdown italic.
    */

    safe =
        safe.replace(
            /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


    /*
       Preserve line breaks.
    */

    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";
    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    /*
       IMPORTANT:

       Old code used:

       bubble.textContent = text;

       That displayed LaTeX as raw text.

       New code uses innerHTML after
       escaping the content, allowing
       MathJax to render mathematics.
    */

    if (type === "assistant") {

        bubble.innerHTML =
            formatAIText(text);

    } else {

        bubble.textContent =
            text == null
                ? ""
                : String(text);
    }


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    /*
       Tell MathJax to render only
       this new assistant message.

       This is much faster than
       re-rendering the entire chat.
    */

    if (
        type === "assistant" &&
        window.MathJax
    ) {

        MathJax.typesetPromise(
            [bubble]
        )
        .then(() => {

            chat.scrollTop =
                chat.scrollHeight;

        })
        .catch(
            error => {

                console.error(
                    "MathJax error:",
                    error
                );

            }
        );

    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "typing";


    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   CHECK BACKEND
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/health"
            );


        if (!response.ok) {

            throw new Error(
                "Backend unavailable"
            );
        }


        const data =
            await response.json();


        if (
            data.gemini &&
            data.langsearch
        ) {

            statusText.textContent =
                "SYSTEM ONLINE";

        } else if (
            data.gemini
        ) {

            statusText.textContent =
                "SYSTEM ONLINE";

        } else {

            statusText.textContent =
                "SYSTEM PARTIAL";
        }


    } catch (error) {

        console.error(
            "Health error:",
            error
        );


        statusText.textContent =
            "SYSTEM OFFLINE";
    }
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (
        !message ||
        sendButton.disabled
    ) {

        return;
    }


    /* -----------------------------------------------
       SHOW USER MESSAGE
    ----------------------------------------------- */

    addMessage(
        message,
        "user"
    );


    /* -----------------------------------------------
       SAVE USER MESSAGE IN TEMPORARY MEMORY
    ----------------------------------------------- */

    conversation.push({

        role: "user",

        content: message

    });


    input.value = "";

    input.disabled = true;

    sendButton.disabled = true;


    const typing =
        createTyping();


    try {

        const response =
            await fetch(

                API_BASE +
                "/api/chat",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                conversation

                        })

                }

            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Invalid response from ASTRA server"
            );
        }


        if (!response.ok) {

            throw new Error(

                data.detail ||

                (
                    "ASTRA request failed (" +
                    response.status +
                    ")"
                )

            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        typing.remove();


        /* -------------------------------------------
           SHOW ASTRA RESPONSE
        ------------------------------------------- */

        addMessage(
            answer,
            "assistant"
        );


        /* -------------------------------------------
           SAVE ASTRA RESPONSE IN TEMP MEMORY
        ------------------------------------------- */

        conversation.push({

            role: "assistant",

            content: answer

        });


    } catch (error) {

        typing.remove();


        console.error(
            "ASTRA error:",
            error
        );


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"

        );

    } finally {

        input.disabled = false;

        sendButton.disabled = false;

        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   START
========================================================= */

checkBackend();

input.focus();


/* =========================================================
   MATHJAX READY
========================================================= */

window.addEventListener(
    "load",
    function() {

        if (window.MathJax) {

            MathJax.startup.promise
                .then(() => {

                    console.log(
                        "ASTRA MathJax ready"
                    );

                });

        }

    }
);

</script>
