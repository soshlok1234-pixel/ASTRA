
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRA | OCA NDA AI</title>

<!-- MathJax: renders mathematical equations -->
<script>
window.MathJax = {
    tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
    },
    options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    startup: {
        typeset: false
    }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Markdown formatting and HTML sanitization -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

:root {
    --bg:#080b08;
    --panel:#0d120e;
    --border:#30382f;
    --gold:#c5a75b;
    --white:#f1f2ed;
    --muted:#929a8d;
    --green:#54c477;
}

body {
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 0%,rgba(93,111,67,.14),transparent 40%),
        #080b08;
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {
    width:97%;
    max-width:1450px;
    height:94vh;
    background:linear-gradient(145deg,rgba(16,22,16,.97),rgba(7,10,8,.98));
    border:1px solid #3b4337;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.app::after {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:45px 45px;
    opacity:.18;
    z-index:0;
}

.watermark {
    position:absolute;
    width:520px;
    height:520px;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    background-image:url("logo.png");
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    opacity:.055;
    filter:grayscale(100%) brightness(1.7);
    pointer-events:none;
    z-index:1;
}

header {
    min-height:105px;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg,rgba(18,24,18,.98),rgba(10,14,10,.96));
    border-bottom:1px solid #394236;
    position:relative;
    z-index:10;
}

.brand { display:flex; align-items:center; gap:18px; }

.brand-mark {
    width:52px;
    height:52px;
    border:1px solid #70623d;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-weight:bold;
    font-size:19px;
    letter-spacing:2px;
    background:linear-gradient(145deg,#20271c,#0e130e);
}

.brand-text { display:flex; flex-direction:column; gap:3px; }

.astra {
    font-size:31px;
    font-weight:800;
    letter-spacing:7px;
    color:#f3f3ef;
}

.subtitle {
    font-size:11px;
    letter-spacing:2.8px;
    color:var(--gold);
    text-transform:uppercase;
}

.header-right { display:flex; align-items:center; gap:25px; }

.system-status {
    display:flex;
    align-items:center;
    gap:8px;
    color:#8fd49e;
    font-size:13px;
    letter-spacing:1px;
}

.status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px rgba(84,196,119,.8);
}

#newChatButton {
    padding:12px 19px;
    background:linear-gradient(145deg,#1b241a,#111711);
    color:#dddccf;
    border:1px solid #4c5646;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

#newChatButton:hover {
    border-color:var(--gold);
    color:white;
    background:#222c1f;
}

.command-bar {
    min-height:44px;
    padding:0 30px;
    display:flex;
    align-items:center;
    gap:25px;
    background:#0b100b;
    border-bottom:1px solid #252c24;
    position:relative;
    z-index:8;
}

.command-item {
    color:#687064;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.command-item.active { color:var(--gold); }

.separator { height:15px; width:1px; background:#323a30; }

.chat {
    flex:1;
    overflow-y:auto;
    padding:35px 32px 30px;
    position:relative;
    z-index:5;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar { width:8px; }
.chat::-webkit-scrollbar-thumb { background:#30382f; border-radius:10px; }

.message {
    margin-bottom:27px;
    display:flex;
    animation:messageIn .22s ease;
    position:relative;
}

@keyframes messageIn {
    from { opacity:0; transform:translateY(7px); }
    to { opacity:1; transform:translateY(0); }
}

.message.user { justify-content:flex-end; }

.bubble {
    max-width:85%;
    padding:18px 21px;
    border-radius:14px;
    line-height:1.75;
    overflow-wrap:anywhere;
    font-size:16px;
    position:relative;
}

.assistant .bubble {
    background:linear-gradient(145deg,rgba(23,31,23,.97),rgba(15,21,16,.97));
    border:1px solid #293329;
    color:#e5e8df;
    border-left:3px solid #667650;
    border-bottom-left-radius:4px;
}

.user .bubble {
    background:linear-gradient(145deg,#3b523b,#2b402f);
    border:1px solid #4d644c;
    color:#f2f4ed;
    border-bottom-right-radius:4px;
    white-space:pre-wrap;
}

.message.assistant::before {
    content:"ASTRA";
    position:absolute;
    top:-17px;
    left:4px;
    font-size:9px;
    letter-spacing:1.5px;
    color:#77846b;
}

/* Formatted AI response */

.assistant .bubble p { margin:0 0 13px; }
.assistant .bubble p:last-child { margin-bottom:0; }

.assistant .bubble h1,
.assistant .bubble h2,
.assistant .bubble h3,
.assistant .bubble h4 {
    color:#e0c77d;
    margin:18px 0 10px;
    line-height:1.4;
}

.assistant .bubble h1 { font-size:23px; }
.assistant .bubble h2 { font-size:20px; }
.assistant .bubble h3 { font-size:18px; }

.assistant .bubble ul,
.assistant .bubble ol {
    padding-left:25px;
    margin:10px 0 15px;
}

.assistant .bubble li { margin:6px 0; }

.assistant .bubble strong { color:#e0c77d; }

.assistant .bubble blockquote {
    border-left:3px solid var(--gold);
    padding:8px 13px;
    margin:12px 0;
    background:rgba(197,167,91,.07);
}

.assistant .bubble code {
    background:#080d08;
    padding:3px 6px;
    border-radius:5px;
    color:#d8c17e;
}

.assistant .bubble pre {
    background:#080d08;
    padding:14px;
    border-radius:8px;
    overflow-x:auto;
    margin:12px 0;
}

.assistant .bubble pre code {
    padding:0;
    background:transparent;
    color:#d8e4ce;
}

.assistant .bubble a { color:#d9bd6d; }

.assistant .bubble hr {
    border:0;
    border-top:1px solid #394236;
    margin:15px 0;
}

/* MathJax equation formatting */

.assistant .bubble mjx-container {
    color:#f1e6c3 !important;
    max-width:100%;
}

.assistant .bubble mjx-container[display="true"] {
    display:block;
    overflow-x:auto;
    overflow-y:hidden;
    padding:13px 8px;
    margin:15px 0 !important;
    background:rgba(0,0,0,.20);
    border-radius:8px;
}

.assistant .bubble table {
    border-collapse:collapse;
    width:100%;
    margin:12px 0;
}

.assistant .bubble th,
.assistant .bubble td {
    border:1px solid #394236;
    padding:9px;
    text-align:left;
}

.assistant .bubble th {
    color:#e0c77d;
    background:#172017;
}

/* Welcome */

.welcome {
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-content { position:relative; z-index:3; }

.welcome-emblem {
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border:1px solid #685a38;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    background:radial-gradient(circle,#242b1d,#0d120d);
}

.welcome h1 {
    font-size:52px;
    letter-spacing:11px;
    margin-bottom:9px;
    color:#f1f2ed;
}

.welcome .tagline {
    color:var(--gold);
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:17px;
}

.welcome p {
    color:#788174;
    font-size:15px;
    max-width:520px;
    line-height:1.7;
}

.typing {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:20px;
    color:#7d8778;
    font-size:13px;
}

.typing span.dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#82906f;
    animation:typing 1.1s infinite;
}

.typing span.dot:nth-child(2) { animation-delay:.15s; }
.typing span.dot:nth-child(3) { animation-delay:.3s; }

@keyframes typing {
    0%,60%,100% { opacity:.3; transform:translateY(0); }
    30% { opacity:1; transform:translateY(-4px); }
}

.input-area {
    min-height:90px;
    padding:15px 20px;
    display:flex;
    gap:11px;
    background:linear-gradient(180deg,#0b100b,#090d09);
    border-top:1px solid #30382f;
    position:relative;
    z-index:10;
}

.input-wrap { flex:1; position:relative; }

#messageInput {
    width:100%;
    height:58px;
    background:#0c120d;
    color:#f1f2ed;
    border:1px solid #394538;
    border-radius:11px;
    padding:0 18px;
    outline:none;
    font-size:16px;
    transition:.2s;
}

#messageInput::placeholder { color:#697267; }

#messageInput:focus {
    border-color:#687953;
    box-shadow:0 0 0 3px rgba(104,121,83,.08);
}

#sendButton {
    height:58px;
    min-width:105px;
    border:1px solid #77643a;
    border-radius:11px;
    background:linear-gradient(145deg,#77643a,#5c4c2d);
    color:#fff8df;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

#sendButton:hover {
    background:linear-gradient(145deg,#8c7645,#6d5a34);
    transform:translateY(-1px);
}

#sendButton:disabled { opacity:.5; cursor:not-allowed; transform:none; }

@media(max-width:750px) {
    body { align-items:stretch; }

    .app {
        width:100%;
        height:100vh;
        height:100dvh;
        border-radius:0;
    }

    header { min-height:82px; padding:0 16px; }

    .brand-mark { width:42px; height:42px; font-size:15px; }
    .brand { gap:10px; }
    .astra { font-size:25px; letter-spacing:5px; }
    .subtitle { font-size:8px; letter-spacing:1.8px; }
    .system-status { display:none; }

    #newChatButton { padding:10px 12px; font-size:12px; }

    .command-bar {
        padding:0 15px;
        gap:12px;
        overflow-x:auto;
    }

    .command-item { font-size:8px; white-space:nowrap; }

    .chat { padding:28px 15px; }
    .bubble { max-width:95%; font-size:15px; }

    .welcome h1 { font-size:40px; letter-spacing:7px; }
    .watermark { width:350px; height:350px; }

    .input-area { padding:11px; }
    #messageInput { height:53px; font-size:15px; }
    #sendButton { height:53px; min-width:72px; }
}
</style>
</head>

<body>
<div class="app">

    <div class="watermark"></div>

    <header>
        <div class="brand">
            <div class="brand-mark">OCA</div>
            <div class="brand-text">
                <div class="astra">ASTRA</div>
                <div class="subtitle">OCA • NDA PREPARATION AI</div>
            </div>
        </div>

        <div class="header-right">
            <div class="system-status">
                <span class="status-dot"></span>
                <span id="statusText">CONNECTING...</span>
            </div>
            <button id="newChatButton">+ New Chat</button>
        </div>
    </header>

    <div class="command-bar">
        <span class="command-item active">ASTRA COMMAND</span>
        <span class="separator"></span>
        <span class="command-item">NDA PREPARATION</span>
        <span class="separator"></span>
        <span class="command-item">GAT</span>
        <span class="separator"></span>
        <span class="command-item">MATHEMATICS</span>
        <span class="separator"></span>
        <span class="command-item">CURRENT AFFAIRS</span>
        <span class="separator"></span>
        <span class="command-item">DEFENCE</span>
    </div>

    <div class="chat" id="chat">
        <div class="welcome" id="welcome">
            <div class="welcome-content">
                <div class="welcome-emblem">OCA</div>
                <h1>ASTRA</h1>
                <div class="tagline">NDA PREPARATION AI</div>
                <p>
                    Your intelligent academic assistant
                    for NDA preparation, mathematics,
                    GAT, current affairs and defence studies.
                    Ask me anything to get started.
                </p>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrap">
            <input
                id="messageInput"
                type="text"
                placeholder="Enter your question for ASTRA..."
                autocomplete="off"
            >
        </div>
        <button id="sendButton">SEND</button>
    </div>

</div>

<script>
/* ASTRA BACKEND */
const API_BASE = "https://astra-backend-2hac.onrender.com";

/* ELEMENTS */
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const newChatButton = document.getElementById("newChatButton");
const statusText = document.getElementById("statusText");
const welcome = document.getElementById("welcome");

/* TEMPORARY SESSION MEMORY */
function createSessionId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

let astraSessionId = sessionStorage.getItem("astra_session_id");

if (!astraSessionId) {
    astraSessionId = createSessionId();
    sessionStorage.setItem("astra_session_id", astraSessionId);
}

let conversationHistory = [];
let isSending = false;

/* MARKDOWN CONFIGURATION */
if (window.marked) {
    marked.setOptions({
        breaks: true,
        gfm: true
    });
}

/* RENDER AI RESPONSE SAFELY */
function renderAssistantText(text) {
    let html;

    if (window.marked && window.DOMPurify) {
        html = marked.parse(text);
        html = DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true }
        });
    } else {
        // Safe fallback if formatting libraries fail to load.
        html = escapeHTML(text).replace(/\n/g, "<br>");
    }

    return html;
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

/* ADD MESSAGE TO SCREEN */
function addMessage(text, type) {
    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (type === "assistant") {
        bubble.innerHTML = renderAssistantText(text);
    } else {
        bubble.textContent = text;
    }

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    // Render equations after inserting the response.
    if (type === "assistant" && window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([bubble]).catch(function(error) {
            console.error("Math rendering error:", error);
        });
    }
}

/* REMEMBER MESSAGES */
function rememberMessage(role, content) {
    conversationHistory.push({
        role: role,
        content: content
    });

    conversationHistory = conversationHistory.slice(-30);
}

/* CLEAR SCREEN */
function clearChatScreen() {
    chat.querySelectorAll(".message, .typing").forEach(function(element) {
        element.remove();
    });

    if (welcome) {
        welcome.style.display = "flex";
    }
}

/* BACKEND STATUS */
async function checkBackend() {
    try {
        const response = await fetch(API_BASE + "/health");

        if (!response.ok) {
            throw new Error("Backend unavailable");
        }

        const data = await response.json();

        statusText.textContent =
            data.gemini === false ? "AI KEY MISSING" : "SYSTEM ONLINE";

    } catch (error) {
        statusText.textContent = "SYSTEM OFFLINE";
        console.error("Backend health check:", error);
    }
}

/* TYPING INDICATOR */
function createTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";

    typing.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>ASTRA is processing...</span>
    `;

    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    return typing;
}

/* SEND MESSAGE */
async function sendMessage() {
    const message = input.value.trim();

    if (!message || isSending) return;

    isSending = true;

    addMessage(message, "user");
    rememberMessage("user", message);

    input.value = "";
    sendButton.disabled = true;
    input.disabled = true;

    const typing = createTyping();

    try {
        const response = await fetch(API_BASE + "/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: conversationHistory.slice(0, -1),
                session_id: astraSessionId
            })
        });

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok) {
            throw new Error(
                typeof data.detail === "string"
                    ? data.detail
                    : "ASTRA request failed. HTTP " + response.status
            );
        }

        const answer =
            typeof data.reply === "string" && data.reply.trim()
                ? data.reply.trim()
                : "ASTRA did not return a response.";

        addMessage(answer, "assistant");
        rememberMessage("assistant", answer);

    } catch (error) {
        console.error("ASTRA chat error:", error);

        addMessage(
            "Connection error.\n\n" + error.message,
            "assistant"
        );

        statusText.textContent = "CONNECTION ERROR";

    } finally {
        typing.remove();

        sendButton.disabled = false;
        input.disabled = false;
        isSending = false;

        input.focus();
    }
}

/* NEW CHAT */
newChatButton.addEventListener("click", async function() {
    if (isSending) return;

    const oldSessionId = astraSessionId;

    const confirmation = confirm(
        "Start a new temporary chat?\n\nYour current temporary memory will be cleared."
    );

    if (!confirmation) return;

    try {
        await fetch(
            API_BASE + "/api/session/" + encodeURIComponent(oldSessionId),
            { method: "DELETE" }
        );
    } catch (error) {
        console.log("Could not clear old server session:", error);
    }

    astraSessionId = createSessionId();
    sessionStorage.setItem("astra_session_id", astraSessionId);

    conversationHistory = [];
    clearChatScreen();

    statusText.textContent = "SYSTEM ONLINE";
    input.focus();
});

/* SEND BUTTON */
sendButton.addEventListener("click", sendMessage);

/* ENTER KEY */
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

/* START ASTRA */
checkBackend();
input.focus();
</script>

</body>
</html>
