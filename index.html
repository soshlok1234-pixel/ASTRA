<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA | OCA NDA AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #080b08;
    --panel: #0d120e;
    --panel2: #111811;
    --border: #30382f;

    --olive: #596642;
    --olive-light: #7f9160;

    --gold: #c5a75b;
    --gold-light: #e0c77d;

    --white: #f1f2ed;
    --muted: #929a8d;

    --green: #54c477;
}

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(93,111,67,.14),
            transparent 40%
        ),
        #080b08;

    color: var(--white);

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =========================================================
   APP
========================================================= */

.app {

    width: 97%;

    max-width: 1450px;

    height: 94vh;

    background:
        linear-gradient(
            145deg,
            rgba(16,22,16,.97),
            rgba(7,10,8,.98)
        );

    border: 1px solid #3b4337;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    position: relative;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 0 80px rgba(255,255,255,.015);
}


/* =========================================================
   GRID
========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .18;

    z-index: 0;
}


/* =========================================================
   WATERMARK
========================================================= */

.watermark {

    position: absolute;

    width: 520px;

    height: 520px;

    left: 50%;

    top: 53%;

    transform: translate(-50%,-50%);

    background-image: url("logo.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    opacity: .055;

    filter:
        grayscale(100%)
        brightness(1.7);

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 105px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            180deg,
            rgba(18,24,18,.98),
            rgba(10,14,10,.96)
        );

    border-bottom: 1px solid #394236;

    position: relative;

    z-index: 10;
}


.brand {

    display: flex;

    align-items: center;

    gap: 18px;
}


.brand-mark {

    width: 52px;

    height: 52px;

    border: 1px solid #70623d;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-weight: bold;

    font-size: 19px;

    letter-spacing: 2px;

    background:
        linear-gradient(
            145deg,
            #20271c,
            #0e130e
        );

    box-shadow:
        inset 0 0 20px rgba(197,167,91,.06);
}


.brand-text {

    display: flex;

    flex-direction: column;

    gap: 3px;
}


.astra {

    font-size: 31px;

    font-weight: 800;

    letter-spacing: 7px;

    color: #f3f3ef;
}


.subtitle {

    font-size: 11px;

    letter-spacing: 2.8px;

    color: var(--gold);

    text-transform: uppercase;
}


/* =========================================================
   STATUS
========================================================= */

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;
}


.system-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #8fd49e;

    font-size: 13px;

    letter-spacing: 1px;
}


.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px rgba(84,196,119,.8);
}


/* =========================================================
   NEW CHAT
========================================================= */

#newChatButton {

    padding: 12px 19px;

    background:
        linear-gradient(
            145deg,
            #1b241a,
            #111711
        );

    color: #dddccf;

    border: 1px solid #4c5646;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    letter-spacing: .5px;

    transition: .2s;
}


#newChatButton:hover {

    border-color: var(--gold);

    color: white;

    background: #222c1f;
}


/* =========================================================
   COMMAND BAR
========================================================= */

.command-bar {

    height: 44px;

    padding: 0 30px;

    display: flex;

    align-items: center;

    gap: 25px;

    background: #0b100b;

    border-bottom: 1px solid #252c24;

    position: relative;

    z-index: 8;
}


.command-item {

    color: #687064;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


.command-item.active {

    color: var(--gold);
}


.separator {

    height: 15px;

    width: 1px;

    background: #323a30;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 35px 32px 30px;

    position: relative;

    z-index: 5;

    scroll-behavior: smooth;
}


.chat::-webkit-scrollbar {

    width: 8px;
}


.chat::-webkit-scrollbar-track {

    background: transparent;
}


.chat::-webkit-scrollbar-thumb {

    background: #30382f;

    border-radius: 10px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    margin-bottom: 24px;

    display: flex;

    animation: messageIn .22s ease;
}


@keyframes messageIn {

    from {

        opacity: 0;

        transform: translateY(7px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}


.message.user {

    justify-content: flex-end;
}


.bubble {

    max-width: 78%;

    padding: 17px 20px;

    border-radius: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 16px;

    position: relative;
}


.assistant .bubble {

    background:
        linear-gradient(
            145deg,
            rgba(23,31,23,.96),
            rgba(15,21,16,.96)
        );

    border: 1px solid #293329;

    color: #e5e8df;

    border-left: 3px solid #667650;

    border-bottom-left-radius: 4px;
}


.user .bubble {

    background:
        linear-gradient(
            145deg,
            #3b523b,
            #2b402f
        );

    border: 1px solid #4d644c;

    color: #f2f4ed;

    border-bottom-right-radius: 4px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.welcome-content {

    position: relative;

    z-index: 3;
}


.welcome-emblem {

    width: 82px;

    height: 82px;

    margin: 0 auto 20px;

    border: 1px solid #685a38;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--gold);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;

    background:
        radial-gradient(
            circle,
            #242b1d,
            #0d120d
        );

    box-shadow:
        0 0 35px rgba(197,167,91,.08);
}


.welcome h1 {

    font-size: 52px;

    letter-spacing: 11px;

    margin-bottom: 9px;

    color: #f1f2ed;
}


.welcome .tagline {

    color: var(--gold);

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 17px;
}


.welcome p {

    color: #788174;

    font-size: 15px;

    max-width: 520px;

    line-height: 1.7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 20px;

    color: #7d8778;

    font-size: 13px;
}


.typing .dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #82906f;

    animation: typing 1.1s infinite;
}


.typing .dot:nth-child(2) {

    animation-delay: .15s;
}


.typing .dot:nth-child(3) {

    animation-delay: .3s;
}


@keyframes typing {

    0%,60%,100% {

        opacity: .3;

        transform: translateY(0);
    }

    30% {

        opacity: 1;

        transform: translateY(-4px);
    }
}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    min-height: 90px;

    padding: 15px 20px;

    display: flex;

    gap: 11px;

    background:
        linear-gradient(
            180deg,
            #0b100b,
            #090d09
        );

    border-top: 1px solid #30382f;

    position: relative;

    z-index: 10;
}


.input-wrap {

    flex: 1;

    position: relative;
}


#messageInput {

    width: 100%;

    height: 58px;

    background: #0c120d;

    color: #f1f2ed;

    border: 1px solid #394538;

    border-radius: 11px;

    padding: 0 18px;

    outline: none;

    font-size: 16px;

    transition: .2s;
}


#messageInput::placeholder {

    color: #697267;
}


#messageInput:focus {

    border-color: #687953;

    box-shadow:
        0 0 0 3px rgba(104,121,83,.08);
}


#sendButton {

    height: 58px;

    min-width: 105px;

    border: 1px solid #77643a;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #77643a,
            #5c4c2d
        );

    color: #fff8df;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}


#sendButton:hover {

    background:
        linear-gradient(
            145deg,
            #8c7645,
            #6d5a34
        );

    transform: translateY(-1px);
}


#sendButton:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px) {

    .app {

        width: 100%;

        height: 100vh;

        border-radius: 0;
    }

    header {

        height: 82px;

        padding: 0 16px;
    }

    .brand-mark {

        width: 42px;

        height: 42px;

        font-size: 15px;
    }

    .astra {

        font-size: 25px;

        letter-spacing: 5px;
    }

    .subtitle {

        font-size: 8px;

        letter-spacing: 1.8px;
    }

    .system-status {

        display: none;
    }

    #newChatButton {

        padding: 10px 12px;

        font-size: 12px;
    }

    .command-bar {

        padding: 0 15px;

        gap: 12px;

        overflow: hidden;
    }

    .command-item {

        font-size: 8px;

        white-space: nowrap;
    }

    .chat {

        padding: 28px 15px;
    }

    .bubble {

        max-width: 90%;

        font-size: 15px;
    }

    .welcome h1 {

        font-size: 40px;

        letter-spacing: 7px;
    }

    .watermark {

        width: 350px;

        height: 350px;
    }

    .input-area {

        padding: 11px;
    }

    #messageInput {

        height: 53px;

        font-size: 15px;
    }

    #sendButton {

        height: 53px;

        min-width: 72px;
    }
}

</style>
</head>


<body>


<div class="app">


    <div class="watermark"></div>


    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="brand-mark">
                OCA
            </div>

            <div class="brand-text">

                <div class="astra">
                    ASTRA
                </div>

                <div class="subtitle">
                    OCA • NDA PREPARATION AI
                </div>

            </div>

        </div>


        <div class="header-right">

            <div class="system-status">

                <span class="status-dot"></span>

                <span id="statusText">
                    SYSTEM ONLINE
                </span>

            </div>


            <button id="newChatButton">
                + New Chat
            </button>

        </div>

    </header>


    <!-- COMMAND BAR -->

    <div class="command-bar">

        <span class="command-item active">
            ASTRA COMMAND
        </span>

        <span class="separator"></span>

        <span class="command-item">
            NDA PREPARATION
        </span>

        <span class="separator"></span>

        <span class="command-item">
            GAT
        </span>

        <span class="separator"></span>

        <span class="command-item">
            MATHEMATICS
        </span>

        <span class="separator"></span>

        <span class="command-item">
            CURRENT AFFAIRS
        </span>

        <span class="separator"></span>

        <span class="command-item">
            DEFENCE
        </span>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <div class="welcome-emblem">
                    OCA
                </div>

                <h1>ASTRA</h1>

                <div class="tagline">
                    NDA PREPARATION AI
                </div>

                <p>
                    Your intelligent academic assistant
                    for NDA preparation, mathematics,
                    GAT, current affairs and defence studies.
                </p>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrap">

            <input
                id="messageInput"
                type="text"
                placeholder="Enter your question for ASTRA..."
                autocomplete="off"
            >

        </div>


        <button id="sendButton">
            SEND
        </button>

    </div>


</div>


<script>

/* =========================================================
   ASTRA CONFIGURATION
========================================================= */

const API_BASE =
    "https://astra-backend-2hac.onrender.com";


/* =========================================================
   GET ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const statusText =
    document.getElementById("statusText");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   SAFETY CHECK
   Prevents the exact null.addEventListener error
========================================================= */

if (
    !chat ||
    !input ||
    !sendButton ||
    !newChatButton ||
    !statusText ||
    !welcome
) {

    console.error(
        "ASTRA: Required HTML elements are missing."
    );

    throw new Error(
        "ASTRA interface could not initialize."
    );
}


/* =========================================================
   CONVERSATION ID
=========================================================

IMPORTANT:

Do NOT create a random conversation ID here.

The backend creates the real conversation ID.

We only use the ID returned by:

POST /api/chat
========================================================= */

let conversationId =
    localStorage.getItem(
        "astra_conversation_id"
    );


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text, type) {

    welcome.style.display = "none";


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(bubble);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   CLEAR SCREEN
========================================================= */

function clearChatScreen() {

    chat
        .querySelectorAll(
            ".message, .typing"
        )
        .forEach(
            element => element.remove()
        );


    welcome.style.display =
        "flex";
}


/* =========================================================
   LOAD SAVED CONVERSATION
========================================================= */

async function loadHistory() {

    if (!conversationId) {

        console.log(
            "ASTRA: No saved conversation."
        );

        return;
    }


    console.log(
        "ASTRA: Loading conversation:",
        conversationId
    );


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/conversations/" +
                encodeURIComponent(
                    conversationId
                )
            );


        if (response.status === 404) {

            console.log(
                "ASTRA: Saved conversation no longer exists."
            );

            localStorage.removeItem(
                "astra_conversation_id"
            );

            conversationId = null;

            return;
        }


        if (!response.ok) {

            throw new Error(
                "History request failed: " +
                response.status
            );
        }


        const data =
            await response.json();


        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];


        if (!messages.length) {

            console.log(
                "ASTRA: Conversation is empty."
            );

            return;
        }


        welcome.style.display =
            "none";


        messages.forEach(
            function(message) {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "assistant"
                );

            }
        );


        chat.scrollTop =
            chat.scrollHeight;


        console.log(
            "ASTRA: Conversation loaded successfully."
        );

    }
    catch (error) {

        console.error(
            "ASTRA: History loading error:",
            error
        );

    }
}


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    function() {

        const confirmation =
            confirm(
                "Start a new chat?\n\n" +
                "Your previous conversation will remain saved."
            );


        if (!confirmation) {

            return;
        }


        /*
         * IMPORTANT:
         *
         * We do NOT create a fake UUID.
         *
         * Setting null tells the backend:
         * "Create a new conversation."
         */

        conversationId = null;


        localStorage.removeItem(
            "astra_conversation_id"
        );


        clearChatScreen();


        input.focus();


        console.log(
            "ASTRA: New conversation ready."
        );
    }
);


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_BASE + "/health"
            );


        if (!response.ok) {

            throw new Error();
        }


        statusText.textContent =
            "SYSTEM ONLINE";


    }
    catch (error) {

        statusText.textContent =
            "SYSTEM OFFLINE";


        console.error(
            "ASTRA backend unavailable:",
            error
        );
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function createTyping() {

    const typing =
        document.createElement("div");


    typing.className =
        "typing";


    typing.innerHTML = `

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

        <span>
            ASTRA is processing...
        </span>

    `;


    chat.appendChild(
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return typing;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    /*
     * Show user message immediately.
     */

    addMessage(
        message,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;


    input.disabled =
        true;


    const typing =
        createTyping();


    try {

        console.log(
            "ASTRA: Sending message..."
        );


        const requestBody = {

            message:
                message

        };


        /*
         * Only send conversation_id
         * if we actually have one.
         */

        if (conversationId) {

            requestBody.conversation_id =
                conversationId;
        }


        const response =
            await fetch(

                API_BASE +
                "/api/chat",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )

                }

            );


        let data;


        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "ASTRA server returned invalid JSON."
            );
        }


        typing.remove();


        if (!response.ok) {

            throw new Error(

                data.detail ||
                "ASTRA request failed."

            );
        }


        /*
         * =====================================================
         * VERY IMPORTANT
         *
         * Save the REAL conversation ID returned by backend.
         * =====================================================
         */

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;


            localStorage.setItem(

                "astra_conversation_id",

                conversationId

            );


            console.log(
                "ASTRA: Conversation saved:",
                conversationId
            );
        }


        const answer =
            data.reply ||
            "ASTRA did not return a response.";


        addMessage(
            answer,
            "assistant"
        );


    }
    catch (error) {

        typing.remove();


        console.error(
            "ASTRA CHAT ERROR:",
            error
        );


        addMessage(

            "Connection error.\n\n" +
            error.message,

            "assistant"

        );

    }
    finally {

        sendButton.disabled =
            false;


        input.disabled =
            false;


        input.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);


/* =========================================================
   START ASTRA
========================================================= */

console.log(
    "ASTRA starting..."
);


console.log(
    "Current conversation ID:",
    conversationId
);


loadHistory();


checkBackend();


input.focus();

</script>


</body>
</html>
